<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수 양 감각 기르기 활동지</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #fffaf0;
      color: #333;
    }

    .wrap {
      width: min(90%, 520px);
      padding: 42px 30px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 58px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 0 0 28px;
      color: #777;
      line-height: 1.6;
    }

    .start-btn {
      display: inline-block;
      padding: 15px 28px;
      border-radius: 14px;
      background: #ffd95a;
      color: #333;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition: 0.2s;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="icon">🍎🔢</div>

    <h1>수 양 감각 기르기</h1>

    <p>
      그림·이모지·문자를 이용해<br>
      수량 활동지를 만들어 보세요.
    </p>

    <a class="start-btn" href="number_quantity_worksheet.html">
      활동지 만들기
    </a>
  </main>
</body>
</html>
