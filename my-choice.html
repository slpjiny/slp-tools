<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>나의 선택은? 활동지 생성기</title>
<style>
  * { box-sizing:border-box; }
  :root{
    --pink:#f2a7bd; --pink-bg:#fff7fa;
    --blue:#9ebeff; --blue-bg:#f7fbff;
    --purple:#bca7ff; --purple-dark:#9279de;
    --yellow:#ffd84f; --yellow-dark:#efc43b;
    --ink:#333; --panel:#f7f7f8;
  }

  html,body{
    margin:0;
    height:100%;
    background:#e9e9ec;
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    overflow:hidden;
  }

  button,select,textarea,input{font:inherit;}

  .app{
    height:100vh;
    display:grid;
    grid-template-columns:minmax(310px, 38vw) 1fr;
  }

  /* ===== 왼쪽 편집창 ===== */
  .editor{
    height:100vh;
    overflow:auto;
    padding:18px;
    background:#fff;
    border-right:1px solid #d9d9dd;
  }

  .editor h1{
    margin:0 0 6px;
    font-size:21px;
  }

  .editor .sub{
    margin:0 0 16px;
    font-size:13px;
    color:#666;
    line-height:1.5;
  }

  .section{
    border:1px solid #e2e2e5;
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    background:#fff;
  }

  .section-title{
    font-size:14px;
    font-weight:900;
    margin-bottom:8px;
  }

  #bulkInput{
    width:100%;
    min-height:220px;
    resize:vertical;
    border:1.5px solid #cfcfd4;
    border-radius:12px;
    padding:12px;
    line-height:1.5;
    background:#fff;
  }

  .hint{
    margin-top:8px;
    font-size:12px;
    color:#6f6f75;
    line-height:1.5;
  }

  .btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .btn{
    border:0;
    border-radius:10px;
    padding:9px 12px;
    font-weight:800;
    cursor:pointer;
    background:#f0f0f2;
  }

  .btn.primary{background:#fff0a7;}
  .btn.print{background:#e7f3ff;}
  .btn.danger{background:#ffe6e6;}

  .settings{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:12px;
    font-weight:800;
  }

  .field select{
    width:100%;
    padding:9px;
    border:1px solid #d5d5da;
    border-radius:9px;
    background:#fff;
  }

  .field.is-disabled{
    opacity:.42;
  }

  .field.is-disabled select{
    cursor:not-allowed;
  }

  .status{
    min-height:18px;
    margin-top:7px;
    font-size:12px;
    font-weight:800;
    color:#3d7a45;
  }

  /* ===== 오른쪽 실시간 미리보기 ===== */
  .preview-area{
    height:100vh;
    overflow:auto;
    padding:18px 20px 36px;
    background:#ececef;
  }

  .preview-head{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 10px;
    margin:-6px auto 12px;
    max-width:210mm;
    border-radius:12px;
    background:rgba(255,255,255,.95);
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    backdrop-filter:blur(8px);
  }

  .preview-head strong{font-size:14px;}
  .preview-head span{font-size:12px;color:#666;}

  .page-shell{
    margin:0 auto 22px;
    width:max-content;
  }

  .page{
    position:relative;
    width:210mm;
    height:297mm;
    background:#fff;
    box-shadow:0 6px 22px rgba(0,0,0,.15);
    overflow:hidden;
    transform-origin:top center;
  }

  .page-tag{
    position:absolute;
    right:7mm;
    top:6mm;
    font-size:9pt;
    color:#aaa;
    font-weight:700;
  }

  /* 타이틀 */
  .title-cloud{
    position:absolute;
    left:25mm; top:11mm;
    width:160mm; height:28mm;
    background:var(--yellow);
    border:3px solid var(--yellow-dark);
    border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }

  .title-cloud::before,.title-cloud::after{
    content:"";
    position:absolute;
    background:var(--yellow);
    border:3px solid var(--yellow-dark);
    border-radius:50%;
    z-index:-1;
  }
  .title-cloud::before{width:31mm;height:22mm;left:11mm;top:-7mm;}
  .title-cloud::after{width:25mm;height:18mm;right:16mm;top:-5mm;}

  .title-text{
    font-size:20pt;
    font-weight:900;
    white-space:nowrap;
  }
  .title-text span:nth-child(1){color:#ff6f71;}
  .title-text span:nth-child(2){color:#f29a2e;}
  .title-text span:nth-child(3){color:#33b76b;}
  .title-text span:nth-child(4){color:#3b8eea;}
  .title-text span:nth-child(5){color:#8d68d8;}
  .title-text span:nth-child(6){color:#f274af;}

  /* 선택지 */
  .choices{
    position:absolute;
    left:14mm; top:48mm;
    width:182mm;
    display:flex;
    gap:8mm;
  }

  .choice{
    position:relative;
    width:87mm;
    height:43mm;
    border:3px solid;
    border-radius:13px;
    display:flex;
    align-items:center;
    padding:5mm 6mm 5mm 22mm;
  }

  .choice.left{border-color:var(--pink);background:var(--pink-bg);}
  .choice.right{border-color:var(--blue);background:var(--blue-bg);}

  .choice-circle{
    position:absolute;
    left:7mm; top:50%;
    transform:translateY(-50%);
    width:10.5mm; height:10.5mm;
    border-radius:50%;
    border:2.5px solid;
    background:#fff;
  }
  .left .choice-circle{border-color:#e57f9c;}
  .right .choice-circle{border-color:#6e96e4;}

  .choice-text{
    width:100%;
    text-align:center;
    font-weight:800;
    line-height:1.38;
    word-break:keep-all;
    overflow-wrap:anywhere;
    max-height:31mm;
    overflow:hidden;
  }


  .choice-text[contenteditable="true"]{
    cursor:text;
    border-radius:7px;
    padding:1.5mm 1mm;
    min-width:0;
  }

  .choice-text[contenteditable="true"]:focus{
    outline:2px dashed rgba(120,120,120,.45);
    outline-offset:2px;
    background:rgba(255,255,255,.72);
  }

  /* 사고 순서 */
  .flow{
    position:absolute;
    top:99mm; left:10mm;
    width:190mm;
    display:flex; align-items:center; justify-content:center;
    gap:1.6mm;
  }

  .flow-box{
    width:42mm;
    min-height:20mm;
    border-radius:14px;
    border:2.5px solid;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:3mm 2.5mm;
    font-size:10.2pt;
    font-weight:800;
    line-height:1.28;
  }

  .q1{background:#ffe8ef;border-color:#f1aec2;}
  .q2{background:#fff1d6;border-color:#efc66d;}
  .q3{background:#e7f8e8;border-color:#9bd0a1;}
  .q4{background:#e9f0ff;border-color:#a9c0f2;}

  .arrow{
    width:5.5mm;
    text-align:center;
    color:#9c9c9c;
    font-size:17pt;
    font-weight:900;
  }

  /* 쓰기칸 */
  .write-wrap{
    position:absolute;
    left:12mm; right:12mm;
    top:130mm; bottom:12mm;
  }

  .write-box{
    position:absolute;
    inset:0;
    border:3px solid #c7b3ff;
    border-radius:14px;
    background:#fff;
    overflow:hidden;
  }

  .write-label{
    position:absolute;
    left:10mm; top:-7mm;
    z-index:3;
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:6px 15px 7px 12px;
    color:#fff;
    background:var(--purple);
    border:3px solid var(--purple-dark);
    border-radius:999px;
    font-size:13.5pt;
    font-weight:900;
    line-height:1;
  }

  .pencil{
    position:relative;
    display:inline-block;
    width:27px;height:13px;
    transform:rotate(-12deg);
  }
  .pencil .eraser{
    position:absolute;left:0;top:2px;
    width:7px;height:9px;
    background:#ff9bb4;border:2px solid #8469c9;border-right:0;
    border-radius:3px 0 0 3px;
  }
  .pencil .body{
    position:absolute;left:6px;top:2px;
    width:14px;height:9px;
    background:#ffd35a;border:2px solid #8469c9;
  }
  .pencil .tip{
    position:absolute;left:20px;top:2px;
    width:0;height:0;
    border-top:4.5px solid transparent;
    border-bottom:4.5px solid transparent;
    border-left:7px solid #f0cfab;
  }
  .pencil .lead{
    position:absolute;left:26px;top:5px;
    width:0;height:0;
    border-top:2px solid transparent;
    border-bottom:2px solid transparent;
    border-left:4px solid #444;
  }

  .writing-lines{
    position:absolute;
    left:10mm; right:10mm;
    top:12mm; bottom:8mm;
  }

  .writing-line{
    position:absolute;
    left:0; right:0;
    border-bottom:1.4px solid #cfcfcf;
  }

  .blank .writing-lines{display:none;}

  /* 아이패드 세로 모드에서는 상하 배치 */
  @media (max-width: 820px), (orientation:portrait){
    html,body{overflow:auto;}
    .app{
      height:auto;
      min-height:100vh;
      grid-template-columns:1fr;
    }
    .editor{
      height:auto;
      max-height:none;
      border-right:0;
      border-bottom:1px solid #ddd;
    }
    .preview-area{
      height:auto;
      min-height:100vh;
    }
  }

  @page{size:A4 portrait;margin:0;}

  @media print{
    html,body{overflow:visible;background:#fff;}
    .app{display:block;height:auto;}
    .editor,.preview-head{display:none!important;}
    .preview-area{height:auto;overflow:visible;padding:0;background:#fff;}
    .page-shell{
      margin:0 !important;
      width:210mm !important;
      height:297mm !important;
    }
    .page{
      width:210mm;height:297mm;
      box-shadow:none;
      break-after:page;
      page-break-after:always;
      transform:none!important;
    }
    .page-shell:last-child .page{
      break-after:auto;
      page-break-after:auto;
    }
    .page-tag{display:none;}
  }
</style>
</head>

<body>
<div class="app">
  <aside class="editor">
    <h1>나의 선택은? 생성기</h1>
    <p class="sub">
      왼쪽에 문장 쌍을 입력하고 <b>일괄 생성</b>을 누르면 오른쪽에 A4 활동지가 만들어집니다.
    </p>

    <div class="section">
      <div class="section-title">문장 일괄 입력</div>
      <textarea id="bulkInput" spellcheck="false"
        placeholder="탕수육은 찍어 먹어야 한다 : 탕수육은 부어 먹어야 한다
라면에 계란을 넣어야 한다 : 라면에 계란은 넣지 말아야 한다"></textarea>
      <div class="hint">
        한 줄 = 한 페이지<br>
        <b>:</b> 또는 <b>：</b> 앞은 왼쪽 선택지, 뒤는 오른쪽 선택지입니다.
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn primary" id="generateBtn">일괄 생성</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="section">
      <div class="section-title">쓰기칸 설정</div>
      <div class="settings">
        <label class="field">
          형태
          <select id="writeMode">
            <option value="lined" selected>줄 있음</option>
            <option value="blank">백지</option>
          </select>
        </label>
        <label class="field" id="lineCountField">
          줄 수
          <select id="lineCount">
            <option>5</option>
            <option>6</option>
            <option selected>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
          </select>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">도구</div>
      <div class="btn-row">
        <button class="btn" id="clearBtn">전체 비우기</button>
        <button class="btn print" id="printBtn">A4 인쇄 / PDF</button>
      </div>
      <div class="hint">
        생성 후 오른쪽 미리보기의 선택지 문장을 직접 눌러 페이지별로 수정할 수 있습니다.<br>
        저장 기능 없이 자료 생성과 인쇄에만 집중한 버전입니다.
      </div>
    </div>
  </aside>

  <section class="preview-area">
    <div class="preview-head">
      <strong>A4 미리보기</strong>
      <span id="pageCount">0페이지</span>
    </div>
    <main id="pages"></main>
  </section>
</div>

<template id="pageTemplate">
  <div class="page-shell">
    <article class="page">
      <div class="page-tag"></div>

      <div class="title-cloud">
        <div class="title-text" aria-label="나의 선택은?">
          <span>나</span><span>의</span><span> 선</span><span>택</span><span>은</span><span>?</span>
        </div>
      </div>

      <section class="choices">
        <div class="choice left">
          <div class="choice-circle"></div>
          <div class="choice-text" data-role="leftText" contenteditable="true" spellcheck="false"></div>
        </div>
        <div class="choice right">
          <div class="choice-circle"></div>
          <div class="choice-text" data-role="rightText" contenteditable="true" spellcheck="false"></div>
        </div>
      </section>

      <section class="flow">
        <div class="flow-box q1">너의 의견은?</div>
        <div class="arrow">→</div>
        <div class="flow-box q2">그렇게 생각하는<br>까닭은 뭐야?</div>
        <div class="arrow">→</div>
        <div class="flow-box q3">그렇게 되면<br>문제는 없을까?</div>
        <div class="arrow">→</div>
        <div class="flow-box q4">그 문제는 어떻게<br>해결할까?</div>
      </section>

      <section class="write-wrap">
        <div class="write-label">
          <span class="pencil" aria-hidden="true">
            <span class="eraser"></span>
            <span class="body"></span>
            <span class="tip"></span>
            <span class="lead"></span>
          </span>
          <span>생각을 써 보세요.</span>
        </div>

        <div class="write-box" data-role="writeBox">
          <div class="writing-lines" data-role="writingLines"></div>
        </div>
      </section>
    </article>
  </div>
</template>

<script>
(() => {
  const input = document.getElementById("bulkInput");
  const pagesEl = document.getElementById("pages");
  const template = document.getElementById("pageTemplate");
  const statusEl = document.getElementById("status");
  const countEl = document.getElementById("pageCount");
  const writeMode = document.getElementById("writeMode");
  const lineCount = document.getElementById("lineCount");
  const lineCountField = document.getElementById("lineCountField");

  let pageData = [];

  function normalize(s){
    return (s || "").replace(/\s+/g, " ").trim();
  }

  function parse(raw){
    const sourceLines = raw.split(/\r?\n/);
    const result = [];
    const errors = [];

    sourceLines.forEach((source, index) => {
      const line = source.trim();
      if(!line) return;

      const cut = line.search(/[:：]/);
      if(cut < 0){
        errors.push(index + 1);
        return;
      }

      const left = line.slice(0, cut).trim();
      const right = line.slice(cut + 1).trim();

      if(!left || !right){
        errors.push(index + 1);
        return;
      }

      result.push({ left, right });
    });

    return { result, errors };
  }

  function fitChoiceText(el, text){
    const n = [...normalize(text)].length;
    let pt = 16.5;

    if(n > 20) pt = 15.5;
    if(n > 32) pt = 14.2;
    if(n > 46) pt = 12.8;
    if(n > 62) pt = 11.5;
    if(n > 82) pt = 10.5;

    el.style.fontSize = pt + "pt";

    let guard = 0;
    while(el.scrollHeight > el.clientHeight + 1 && pt > 9 && guard < 20){
      pt -= 0.5;
      el.style.fontSize = pt + "pt";
      guard++;
    }
  }

  function drawLines(container, count){
    container.innerHTML = "";
    const n = Math.max(3, Math.min(14, Number(count) || 7));

    for(let i = 1; i <= n; i++){
      const line = document.createElement("div");
      line.className = "writing-line";
      line.style.top = ((i / (n + 1)) * 100) + "%";
      container.appendChild(line);
    }
  }

  function syncLineCountState(){
    const isBlank = writeMode.value === "blank";
    lineCount.disabled = isBlank;
    lineCountField.classList.toggle("is-disabled", isBlank);
  }

  function renderPages(){
    pagesEl.innerHTML = "";

    pageData.forEach((item, idx) => {
      const shell = template.content.firstElementChild.cloneNode(true);
      const left = shell.querySelector('[data-role="leftText"]');
      const right = shell.querySelector('[data-role="rightText"]');
      const box = shell.querySelector('[data-role="writeBox"]');
      const lines = shell.querySelector('[data-role="writingLines"]');

      shell.querySelector(".page-tag").textContent = (idx + 1) + " / " + pageData.length;

      left.textContent = item.left;
      right.textContent = item.right;

      box.classList.toggle("blank", writeMode.value === "blank");
      drawLines(lines, lineCount.value);
      pagesEl.appendChild(shell);

      fitChoiceText(left, item.left);
      fitChoiceText(right, item.right);

      left.addEventListener("input", () => {
        item.left = left.innerText;
        fitChoiceText(left, item.left);
        statusEl.style.color = "#3d7a45";
        statusEl.textContent = (idx + 1) + "페이지를 개별 수정했습니다.";
      });

      right.addEventListener("input", () => {
        item.right = right.innerText;
        fitChoiceText(right, item.right);
        statusEl.style.color = "#3d7a45";
        statusEl.textContent = (idx + 1) + "페이지를 개별 수정했습니다.";
      });

      [left, right].forEach(el => {
        el.addEventListener("keydown", (e) => {
          if(e.key === "Enter" && !e.shiftKey){
            e.preventDefault();
            el.blur();
          }
        });

        el.addEventListener("blur", () => {
          const cleaned = normalize(el.innerText);

          if(el.dataset.role === "leftText") item.left = cleaned;
          if(el.dataset.role === "rightText") item.right = cleaned;

          el.textContent = cleaned;
          fitChoiceText(el, cleaned);
        });
      });
    });

    countEl.textContent = pageData.length + "페이지";
    fitPreview();
  }

  function generateFromBulk(){
    const { result, errors } = parse(input.value);

    pageData = result.map(item => ({
      left: item.left,
      right: item.right
    }));

    renderPages();

    if(errors.length){
      statusEl.style.color = "#c0392b";
      statusEl.textContent =
        pageData.length + "페이지 생성 완료. " +
        errors.join(", ") + "번째 줄은 ':' 형식을 확인해 주세요.";
    } else if(pageData.length){
      statusEl.style.color = "#3d7a45";
      statusEl.textContent =
        pageData.length + "페이지를 생성했습니다. 오른쪽 문장을 눌러 개별 수정할 수 있습니다.";
    } else if(input.value.trim()){
      statusEl.style.color = "#c0392b";
      statusEl.textContent = "생성할 수 있는 문장 쌍이 없습니다. ':' 형식을 확인해 주세요.";
    } else {
      statusEl.style.color = "#666";
      statusEl.textContent = "문장 쌍을 입력한 뒤 '일괄 생성'을 눌러 주세요.";
    }
  }

  document.getElementById("generateBtn").addEventListener("click", generateFromBulk);

  input.addEventListener("keydown", (e) => {
    if((e.ctrlKey || e.metaKey) && e.key === "Enter"){
      e.preventDefault();
      generateFromBulk();
    }
  });

  writeMode.addEventListener("change", () => {
    syncLineCountState();
    renderPages();
  });
  lineCount.addEventListener("change", renderPages);

  document.getElementById("clearBtn").addEventListener("click", () => {
    input.value = "";
    pageData = [];
    pagesEl.innerHTML = "";
    countEl.textContent = "0페이지";
    statusEl.style.color = "#666";
    statusEl.textContent = "입력 내용과 생성된 페이지를 비웠습니다.";
  });

  document.getElementById("printBtn").addEventListener("click", () => {
    if(!pageData.length){
      statusEl.style.color = "#c0392b";
      statusEl.textContent = "먼저 활동지를 생성해 주세요.";
      return;
    }
    window.print();
  });

  function fitPreview(){
    const area = document.querySelector(".preview-area");
    const available = Math.max(320, area.clientWidth - 40);
    const a4px = 210 / 25.4 * 96;
    const a4HeightPx = 297 / 25.4 * 96;
    const scale = Math.min(1, available / a4px);

    document.querySelectorAll(".page").forEach(page => {
      page.style.transform = `scale(${scale})`;
      const shell = page.closest(".page-shell");
      shell.style.height = (a4HeightPx * scale) + "px";
      shell.style.width = (a4px * scale) + "px";
    });
  }

  window.addEventListener("resize", fitPreview);

  statusEl.style.color = "#666";
  statusEl.textContent = "문장 쌍을 입력한 뒤 '일괄 생성'을 눌러 주세요.";
  syncLineCountState();
  fitPreview();
})();
</script>
</body>
</html>
