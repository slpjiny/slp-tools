<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>어휘 뜻 매칭 문제지 만들기</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f4f6f8;color:#111}
.app{max-width:1280px;margin:0 auto;padding:24px;display:grid;grid-template-columns:390px minmax(0,1fr);gap:24px}
.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px}
h2{margin:0 0 14px;font-size:20px}
button,input,select,textarea{font:inherit}
button{min-height:42px;padding:9px 13px;border:1px solid #bbb;border-radius:10px;background:#fff;cursor:pointer}
button.primary{background:#111;color:#fff;border-color:#111}
button.danger{color:#b00;border-color:#d99}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
label{font-size:13px;font-weight:700}
select{width:100%;margin-top:6px;padding:9px;border:1px solid #bbb;border-radius:8px;background:#fff}
.item{border:1px solid #ddd;border-radius:12px;padding:11px;margin-bottom:10px;background:#fafafa}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.item-num{font-size:13px;font-weight:700}
.item-grid{display:grid;gap:7px}
.item input{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px}
.note{font-size:12px;line-height:1.6;color:#666;margin-top:12px}
.bulk-box{margin-top:16px;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fafafa}
.bulk-box h3{margin:0 0 8px;font-size:15px}
.bulk-box textarea{width:100%;min-height:140px;padding:10px;border:1px solid #bbb;border-radius:8px;resize:vertical;font:inherit}
.bulk-help{font-size:11px;color:#666;line-height:1.6;margin-top:7px}
.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.meta{font-size:12px;color:#777}
.sheet{background:#fff;border:1px solid #ddd;border-radius:16px;padding:26px;min-height:700px}
.sheet-content{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:16px}
.sheet-title{font-size:1.35em;font-weight:700;text-align:center;margin-bottom:18px}
.word-bank{border:1.5px solid #333;padding:10px 14px;margin-bottom:24px}
.bank-label{font-weight:700;margin-bottom:7px}
.bank-words{display:flex;flex-wrap:wrap;gap:7px 20px;line-height:1.6}
.problems{display:grid;gap:18px}
.problem{display:grid;grid-template-columns:auto 1fr minmax(110px,25%);gap:8px;align-items:end;line-height:1.65;break-inside:avoid;page-break-inside:avoid}
.answer-line{border-bottom:1.5px solid #333;min-height:1.7em}
.empty{text-align:center;color:#888;padding:40px 0}
.wrong-toggle{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.storage{margin-top:20px;border-top:1px solid #e5e5e5;padding-top:16px}
.storage-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.saved-list{display:grid;gap:8px;max-height:260px;overflow:auto}
.saved-item{border:1px solid #ddd;border-radius:10px;padding:10px;background:#fafafa}
.saved-title{font-weight:700;font-size:13px;line-height:1.4}
.saved-date{font-size:11px;color:#777;margin-top:3px}
.saved-actions{display:flex;gap:6px;margin-top:7px}
.saved-actions button{min-height:32px;padding:5px 9px;font-size:12px}
.status{font-size:12px;color:#555;min-height:18px;margin-top:8px}
.file-label{display:inline-flex;align-items:center;min-height:42px;padding:9px 13px;border:1px solid #bbb;border-radius:10px;background:#fff;cursor:pointer;font-size:14px}
.file-label input{display:none}
.mode-note{font-size:12px;color:#555;margin-top:8px;font-weight:700}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:14px}}
@media(max-width:600px){.problem{grid-template-columns:auto 1fr}.answer-line{grid-column:2}}
@media print{
 @page{size:A4 portrait;margin:12mm}
 body{background:#fff}
 .app{display:block;max-width:none;margin:0;padding:0}
 .controls,.preview-head{display:none!important}
 .panel.preview{border:0;padding:0}
 .sheet{border:0;border-radius:0;padding:0;min-height:0}
 .word-bank{margin-bottom:18px}
}
</style>
</head>
<body>
<div class="app">
<section class="panel controls">
  <h2>어휘 · 뜻 입력</h2>

  <div class="bulk-box">
    <h3>한꺼번에 입력</h3>
    <textarea id="bulkInput" placeholder="예)
함구하다 - 말하지 않고 입을 다물다
필적하다: 능력이나 수준이 서로 비슷하다
해박하다 = 여러 방면의 지식이 넓고 깊다"></textarea>
    <div class="toolbar">
      <button type="button" id="bulkAppendBtn" class="primary">자동 분류해서 추가</button>
      <button type="button" id="bulkReplaceBtn">자동 분류해서 교체</button>
    </div>
    <div class="bulk-help">
      한 줄에 ‘어휘 + 뜻’ 한 쌍을 입력하세요. 구분 기호는 <b>-</b>, <b>:</b>, <b>=</b>, 또는 탭을 자동으로 인식합니다.
      구분 기호는 각 줄에서 처음 나온 위치를 기준으로 나눕니다.
    </div>
  </div>

  <div id="editor"></div>

  <div class="toolbar">
    <button type="button" id="addBtn">항목 추가</button>
    <button type="button" id="wordShuffleBtn" class="primary">보기 랜덤</button>
    <button type="button" id="problemShuffleBtn" class="primary">문제 랜덤</button>
    <button type="button" id="shuffleAllBtn" class="primary">둘 다 랜덤</button>
    <button type="button" id="resetBtn">원래 순서</button>
  </div>

  <div class="settings">
    <label>글씨체
      <select id="fontFamily">
        <option value='"Malgun Gothic","Apple SD Gothic Neo",sans-serif' selected>맑은 고딕</option>
        <option value='"Gulim","굴림",sans-serif'>굴림</option>
        <option value='"Dotum","돋움",sans-serif'>돋움</option>
        <option value='"Batang","바탕",serif'>바탕</option>
        <option value='"Gungsuh","궁서",serif'>궁서</option>
      </select>
    </label>
    <label>글씨 크기
      <select id="fontSize">
        <option value="14">14px</option>
        <option value="16" selected>16px</option>
        <option value="18">18px</option>
        <option value="20">20px</option>
        <option value="22">22px</option>
        <option value="24">24px</option>
      </select>
    </label>
  </div>

  <div class="toolbar">
    <button type="button" id="wrongOnlyBtn">오답만 보기</button>
    <button type="button" id="allItemsBtn">전체 보기</button>
    <button type="button" id="clearWrongBtn">오답 표시 초기화</button>
  </div>

  <div class="toolbar">
    <button type="button" id="printBtn">A4 인쇄하기</button>
  </div>

  <div id="modeNote" class="mode-note">현재: 전체 문항</div>

  <div class="storage">
    <h3>문제 세트 저장</h3>
    <div class="storage-toolbar">
      <button type="button" id="saveSetBtn">현재 세트 저장</button>
      <button type="button" id="backupBtn">전체 백업</button>
      <label class="file-label">백업 복원
        <input id="restoreInput" type="file" accept=".json,application/json">
      </label>
    </div>
    <div id="savedList" class="saved-list"></div>
    <div id="status" class="status" aria-live="polite"></div>
  </div>

  <div class="note">
    어휘와 뜻을 입력하면 보기에는 어휘가, 문제에는 뜻이 자동으로 표시됩니다.
    글씨체와 글씨 크기는 미리보기와 인쇄물에 함께 적용됩니다.
  </div>
</section>

<section class="panel preview">
  <div class="preview-head">
    <h2>미리보기</h2>
    <span id="meta" class="meta"></span>
  </div>
  <div class="sheet">
    <div id="sheetContent" class="sheet-content">
      <div class="sheet-title">어휘 뜻 매칭하기</div>
      <div class="word-bank">
        <div class="bank-label">보기</div>
        <div id="bankWords" class="bank-words"></div>
      </div>
      <div id="problems" class="problems"></div>
    </div>
  </div>
</section>
</div>

<script>
const editor=document.getElementById('editor');
const bankWords=document.getElementById('bankWords');
const problems=document.getElementById('problems');
const meta=document.getElementById('meta');
const sheetContent=document.getElementById('sheetContent');
const fontFamily=document.getElementById('fontFamily');
const fontSize=document.getElementById('fontSize');
const bulkInput=document.getElementById('bulkInput');
const modeNote=document.getElementById('modeNote');
const savedList=document.getElementById('savedList');
const status=document.getElementById('status');
const restoreInput=document.getElementById('restoreInput');
const STORAGE_KEY='vocabMatchingSets_v1';
let wrongOnlyMode=false;

function uid(){return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
let items=[
 {id:uid(),word:'함구하다',meaning:'말하지 않고 입을 다물다',wrong:false},
 {id:uid(),word:'필적하다',meaning:'능력이나 수준이 서로 비슷하다',wrong:false},
 {id:uid(),word:'해박하다',meaning:'여러 방면의 지식이 넓고 깊다',wrong:false}
];
let originalOrder=items.map(x=>x.id);
let bankOrder=items.map(x=>x.id);

function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function renderEditor(){
 editor.innerHTML='';
 items.forEach((item,idx)=>{
   const box=document.createElement('div');
   box.className='item';

   const head=document.createElement('div');
   head.className='item-head';
   const num=document.createElement('span');
   num.className='item-num';
   num.textContent=`항목 ${idx+1}`;
   const wrongWrap=document.createElement('label');
   wrongWrap.className='wrong-toggle';
   const wrongCheck=document.createElement('input');
   wrongCheck.type='checkbox';
   wrongCheck.checked=!!item.wrong;
   wrongCheck.addEventListener('change',e=>{
     item.wrong=e.target.checked;
     renderPreview();
   });
   const wrongText=document.createElement('span');
   wrongText.textContent='오답';
   wrongWrap.append(wrongCheck,wrongText);

   const del=document.createElement('button');
   del.type='button'; del.className='danger'; del.textContent='삭제';
   del.onclick=()=>{
     items=items.filter(x=>x.id!==item.id);
     originalOrder=originalOrder.filter(id=>id!==item.id);
     bankOrder=bankOrder.filter(id=>id!==item.id);
     renderAll();
   };
   head.append(num,wrongWrap,del);

   const grid=document.createElement('div');
   grid.className='item-grid';
   const w=document.createElement('input');
   w.placeholder='어휘'; w.value=item.word;
   w.oninput=e=>{item.word=e.target.value;renderPreview()};
   const m=document.createElement('input');
   m.placeholder='뜻'; m.value=item.meaning;
   m.oninput=e=>{item.meaning=e.target.value;renderPreview()};
   grid.append(w,m);
   box.append(head,grid);
   editor.appendChild(box);
 });
}

function renderPreview(){
 sheetContent.style.fontFamily=fontFamily.value;
 sheetContent.style.fontSize=fontSize.value+'px';

 const displayItems=wrongOnlyMode ? items.filter(x=>x.wrong) : items;
 const displayIds=new Set(displayItems.map(x=>x.id));
 const map=new Map(items.map(x=>[x.id,x]));
 bankWords.innerHTML='';
 bankOrder.map(id=>map.get(id)).filter(item=>item && displayIds.has(item.id)).forEach(item=>{
   const span=document.createElement('span');
   span.textContent=item.word || '어휘';
   bankWords.appendChild(span);
 });

 problems.innerHTML='';
 items.forEach((item,idx)=>{
   const p=document.createElement('div');
   p.className='problem';
   const n=document.createElement('span');
   n.textContent=(idx+1)+'.';
   const meaning=document.createElement('span');
   meaning.textContent=item.meaning || '뜻을 입력하세요.';
   const line=document.createElement('span');
   line.className='answer-line';
   p.append(n,meaning,line);
   problems.appendChild(p);
 });
 meta.textContent=`총 ${displayItems.length}문항`;
 modeNote.textContent=wrongOnlyMode ? `현재: 오답 문항 ${displayItems.length}개` : `현재: 전체 문항 ${items.length}개`;
}

function renderAll(){renderEditor();renderPreview()}



function parseBulkText(raw){
  const lines=(raw||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const parsed=[];
  const failed=[];

  lines.forEach((line,index)=>{
    let pos=-1;
    let sepLen=1;

    const tabPos=line.indexOf('\t');
    const candidates=[
      {p:tabPos, len:1},
      {p:line.indexOf(' - '), len:3},
      {p:line.indexOf(' : '), len:3},
      {p:line.indexOf(' = '), len:3},
      {p:line.indexOf(':'), len:1},
      {p:line.indexOf('='), len:1},
      {p:line.indexOf('-'), len:1}
    ].filter(x=>x.p>0).sort((a,b)=>a.p-b.p);

    if(candidates.length){
      pos=candidates[0].p;
      sepLen=candidates[0].len;
    }

    if(pos<1){
      failed.push({line:index+1,text:line});
      return;
    }

    const word=line.slice(0,pos).trim();
    const meaning=line.slice(pos+sepLen).trim();

    if(!word || !meaning){
      failed.push({line:index+1,text:line});
      return;
    }

    parsed.push({
      id:uid(),
      word,
      meaning,
      wrong:false
    });
  });

  return {parsed,failed};
}

function applyBulk(mode){
  const {parsed,failed}=parseBulkText(bulkInput.value);

  if(!parsed.length){
    alert('자동 분류할 수 있는 어휘와 뜻이 없습니다. 각 줄에 어휘와 뜻을 구분해서 입력해 주세요.');
    return;
  }

  if(mode==='replace'){
    items=parsed;
    originalOrder=items.map(x=>x.id);
    bankOrder=items.map(x=>x.id);
  }else{
    items.push(...parsed);
    parsed.forEach(x=>{
      originalOrder.push(x.id);
      bankOrder.push(x.id);
    });
  }

  wrongOnlyMode=false;
  renderAll();

  if(failed.length){
    status.textContent=`${parsed.length}개 항목을 분류했습니다. ${failed.length}개 줄은 구분하지 못했습니다.`;
  }else{
    status.textContent=`${parsed.length}개 항목을 자동 분류했습니다.`;
    bulkInput.value='';
  }
}

function autoTitle(){
  const first=items.find(x=>x.word.trim())?.word.trim() || '제목 없는 어휘 세트';
  return first.length>24 ? first.slice(0,24)+'…' : first;
}
function loadSets(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    const data=raw?JSON.parse(raw):[];
    return Array.isArray(data)?data:[];
  }catch(e){return []}
}
function saveSets(sets){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(sets));
}
function formatDate(iso){
  const d=new Date(iso);
  return Number.isNaN(d.getTime())?'':d.toLocaleString('ko-KR',{
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'
  });
}
function saveCurrentSet(){
  const now=new Date().toISOString();
  const sets=loadSets();
  sets.push({
    id:uid(),
    title:autoTitle(),
    createdAt:now,
    updatedAt:now,
    fontFamily:fontFamily.value,
    fontSize:fontSize.value,
    items:JSON.parse(JSON.stringify(items)),
    bankOrder:[...bankOrder]
  });
  saveSets(sets);
  status.textContent='현재 어휘 세트를 저장했습니다.';
  renderSavedSets();
}
function renderSavedSets(){
  const sets=loadSets().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  savedList.innerHTML='';
  if(!sets.length){
    const e=document.createElement('div');
    e.className='empty';
    e.textContent='저장된 어휘 세트가 없습니다.';
    savedList.appendChild(e);
    return;
  }
  sets.forEach(set=>{
    const box=document.createElement('div');
    box.className='saved-item';
    const title=document.createElement('div');
    title.className='saved-title';
    title.textContent=set.title || '제목 없는 어휘 세트';
    const date=document.createElement('div');
    date.className='saved-date';
    date.textContent='저장: '+formatDate(set.updatedAt||set.createdAt);
    const actions=document.createElement('div');
    actions.className='saved-actions';

    const loadBtn=document.createElement('button');
    loadBtn.type='button';
    loadBtn.textContent='불러오기';
    loadBtn.addEventListener('click',()=>{
      items=(set.items||[]).map(x=>({...x,wrong:!!x.wrong}));
      originalOrder=items.map(x=>x.id);
      bankOrder=Array.isArray(set.bankOrder)&&set.bankOrder.length ? [...set.bankOrder] : items.map(x=>x.id);
      fontFamily.value=set.fontFamily || '"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
      fontSize.value=String(set.fontSize || '16');
      wrongOnlyMode=false;
      renderAll();
      status.textContent='어휘 세트를 불러왔습니다.';
    });

    const delBtn=document.createElement('button');
    delBtn.type='button';
    delBtn.className='danger';
    delBtn.textContent='삭제';
    delBtn.addEventListener('click',()=>{
      if(!confirm(`"${set.title}" 세트를 삭제할까요?`)) return;
      saveSets(loadSets().filter(x=>x.id!==set.id));
      renderSavedSets();
      status.textContent='저장된 세트를 삭제했습니다.';
    });

    actions.append(loadBtn,delBtn);
    box.append(title,date,actions);
    savedList.appendChild(box);
  });
}
function backupAll(){
  const backup={
    version:1,
    app:'어휘 뜻 매칭 문제지 만들기',
    exportedAt:new Date().toISOString(),
    sets:loadSets(),
    current:{
      fontFamily:fontFamily.value,
      fontSize:fontSize.value,
      items:JSON.parse(JSON.stringify(items)),
      bankOrder:[...bankOrder]
    }
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`어휘뜻매칭_백업_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  status.textContent='저장된 어휘 세트를 백업했습니다.';
}
async function restoreBackup(file){
  if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    const incoming=Array.isArray(data)?data:data.sets;
    if(!Array.isArray(incoming)) throw new Error('형식 오류');

    const replace=confirm(
      `백업 파일에 ${incoming.length}개 세트가 있습니다.\n\n확인: 현재 저장 세트를 지우고 백업으로 교체\n취소: 기존 저장 세트에 추가`
    );

    if(replace){
      saveSets(incoming);
    }else{
      const existing=loadSets();
      const ids=new Set(existing.map(x=>x.id));
      const merged=[...existing];
      incoming.forEach(set=>{
        const copy={...set};
        if(!copy.id || ids.has(copy.id)) copy.id=uid();
        merged.push(copy);
      });
      saveSets(merged);
    }

    renderSavedSets();
    status.textContent='백업 자료를 복원했습니다.';
  }catch(e){
    status.textContent='올바른 백업 파일이 아닙니다.';
  }finally{
    restoreInput.value='';
  }
}

document.getElementById('bulkAppendBtn').onclick=()=>applyBulk('append');
document.getElementById('bulkReplaceBtn').onclick=()=>applyBulk('replace');

document.getElementById('addBtn').onclick=()=>{
 const x={id:uid(),word:'',meaning:'',wrong:false};
 items.push(x); originalOrder.push(x.id); bankOrder.push(x.id); renderAll();
};
document.getElementById('wordShuffleBtn').onclick=()=>{
 bankOrder=shuffle(items.map(x=>x.id)); renderPreview();
};
document.getElementById('problemShuffleBtn').onclick=()=>{
 items=shuffle(items); renderAll();
};
document.getElementById('shuffleAllBtn').onclick=()=>{
 items=shuffle(items);
 bankOrder=shuffle(items.map(x=>x.id));
 renderAll();
};
document.getElementById('resetBtn').onclick=()=>{
 const map=new Map(items.map(x=>[x.id,x]));
 items=originalOrder.map(id=>map.get(id)).filter(Boolean);
 bankOrder=[...originalOrder];
 renderAll();
};
fontFamily.onchange=renderPreview;
fontSize.onchange=renderPreview;
document.getElementById('wrongOnlyBtn').onclick=()=>{
  wrongOnlyMode=true;
  renderPreview();
};
document.getElementById('allItemsBtn').onclick=()=>{
  wrongOnlyMode=false;
  renderPreview();
};
document.getElementById('clearWrongBtn').onclick=()=>{
  items.forEach(x=>x.wrong=false);
  wrongOnlyMode=false;
  renderAll();
};
document.getElementById('saveSetBtn').onclick=saveCurrentSet;
