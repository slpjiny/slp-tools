<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>그림 한글 카드</title>
<style>
:root{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#172033;background:#edf1f6;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button,input,select{min-height:40px}button,select,input[type=text]{border:1px solid #bdc8d8;border-radius:8px;background:white;padding:8px;color:#172033}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3777df}button.primary{background:#1769df;color:white;border-color:#1769df}.app{display:grid;grid-template-columns:310px minmax(0,1fr)}aside{padding:20px;background:white;height:100vh;overflow:auto;position:sticky;top:0;border-right:1px solid #d7dfea}h1{font-size:22px;margin:0 0 16px}h2{font-size:16px;margin:0 0 10px}fieldset{border:0;border-top:1px solid #e2e6ed;padding:16px 0;margin:0}label{display:grid;gap:5px;font-size:14px;color:#39465a}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.row>*{min-width:0}input[type=range],select{width:100%}input[type=color]{width:100%;border:1px solid #c3cbd8;border-radius:8px;background:white}small,.hint{font-size:13px;line-height:1.5;color:#546176}.file{display:grid;gap:5px;margin-top:10px}input[type=file]{font-size:13px;width:100%}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}main{min-width:0;padding:22px}.toolbar strong{margin-right:auto}#status{padding:10px 12px;background:#fff;border-radius:8px;margin:0 0 14px;font-size:14px;line-height:1.5}#status.warning{background:#fff0d7;color:#784500}#sheet{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:14px;align-items:start}.unit{min-width:0}.card{background:white;border:2px solid #c8d1df;border-radius:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);overflow:hidden;min-height:155px;break-inside:avoid;page-break-inside:avoid}.unit.selected .card{outline:3px solid #74a6ef;border-color:#1769df}.picture{position:relative;border-right:1px solid #d3dbe6;display:flex;align-items:center;justify-content:center;min-height:100%;background:white;overflow:hidden}.picture img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.picture button{z-index:1;background:#fffE;font-size:14px;margin:8px;max-width:95%}.picture:has(img) button{opacity:0}.picture:focus-within button,.picture:hover button{opacity:1}.word-area{min-width:0;display:flex;align-items:center;padding:8px}.word-area svg{display:block;width:100%;height:auto;overflow:visible}.editor{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-top:8px}.editor input{width:100%;min-width:0}.editor button{font-size:13px}.layout-warning{font-size:13px;color:#835300;margin:6px 0}.empty{grid-column:1/-1;padding:48px 20px;background:white;border:2px dashed #bbc6d6;border-radius:12px;text-align:center}.preview-mode .editor,.preview-mode .layout-warning,.preview-mode .picture button{display:none}.preview-mode .unit.selected .card{outline:none;border-color:#c8d1df}.hidden{display:none!important}#fontSample{background:#f2f5fa;border-radius:8px;margin:10px 0;padding:8px;display:flex}#fontSample svg{width:100%;height:70px}.preview-mode #sheet{background:white;padding:12px}dialog{max-width:90vw;border:1px solid #ccc;border-radius:12px} @media(max-width:850px){.app{display:block}aside{position:static;height:auto}aside details:not([open]){padding-bottom:4px}main{padding:12px}.card{min-height:95px}.editor{grid-template-columns:1fr}.toolbar{gap:6px}.word-area{padding:3px}}
@media print{html,body{background:white!important}aside,.toolbar,#status,.editor,.layout-warning,.picture button,.hint{display:none!important}.app{display:block}main{padding:0!important}#sheet{padding:0!important;background:white;gap:5mm;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}.unit{break-inside:avoid;page-break-inside:avoid}.unit .card,.unit.selected .card{outline:none!important;border:1px solid #c8d1df!important;min-height:35mm;box-shadow:none}.word-area{padding:2mm}.empty{display:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<style id="pageStyle">@page{size:A4 portrait;margin:10mm}</style>
</head>
<body><div class="app" inert>
<aside><h1>그림 한글 카드</h1><button id="add" class="primary" style="width:100%">＋ 카드 추가</button>
<details open><summary style="margin:16px 0">카드 설정</summary>
<fieldset><h2>배치와 적용 범위</h2><div class="row"><label>열 수<select id="columns"><option value="1">1열</option><option value="2" selected>2열</option><option value="3">3열</option></select></label><label>적용 대상<select id="scope"><option value="all">전체 카드</option><option value="selected">선택 카드</option></select></label></div><p class="hint">전체 적용은 해당 항목의 개별 설정도 함께 바꿉니다.</p></fieldset>
<fieldset><h2>글자</h2><div class="row"><label>자음 색<input id="cons" type="color" value="#e5484d"></label><label>모음 색<input id="vowel" type="color" value="#1769e0"></label></div>
<label>글자 모양<select id="font"><option value="learning">학습용 고딕 · 가로획 ㅊ</option><option value="learning-round">학습용 둥근 고딕 · 가로획 ㅊ</option><option value="Apple SD Gothic Neo">애플 SD 고딕 (기기 글꼴)</option><option value="Malgun Gothic">맑은 고딕 (기기 글꼴)</option><option value="Arial">기본 고딕 (기기 글꼴)</option><option value="custom" disabled>불러온 글꼴</option></select></label>
<div id="fontSample" aria-label="차 추 꽃 글자 모양 확인"></div><small>학습용은 획을 직접 그려 모양·두께를 유지합니다. 기기·불러온 글꼴은 ㅊ 모양과 굵기가 다를 수 있습니다.</small>
<div class="row"><label>두께 <output id="weightOut">700</output><input id="weight" type="range" min="300" max="900" step="50" value="700"></label><label>크기 <output id="fontSizeOut">64</output><input id="fontSize" type="range" min="36" max="100" value="64"></label></div>
<label class="file">글꼴 불러오기<input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2"></label></fieldset>
<fieldset><h2>음절 박스</h2><div class="row"><label>모양<select id="boxShape"><option value="10px">살짝 둥글게</option><option value="0px">네모</option><option value="22px">많이 둥글게</option><option value="50%">동그라미</option></select></label><label>크기<select id="boxSize"><option value="70px">작게</option><option value="82px" selected>보통</option><option value="96px">크게</option></select></label></div><div class="row"><label>테두리 색<input id="boxColor" type="color" value="#98a2b3"></label><label>테두리<select id="boxBorder"><option value="0px">없음</option><option value="1px">얇게</option><option value="2px" selected>보통</option><option value="4px">굵게</option></select></label></div><div class="row"><label>간격<select id="boxGap"><option value="4px">좁게</option><option value="8px" selected>보통</option><option value="14px">넓게</option></select></label><label>긴 단어<select id="longWord"><option value="shrink">자동 축소</option><option value="wrap">다음 줄</option></select></label></div></fieldset>
<fieldset><h2>그림</h2><label>표시 방식<select id="fit"><option value="contain">전체 보기</option><option value="cover">틀 채우기</option></select></label></fieldset></details>
<fieldset><h2>카드 편집</h2><div class="row"><button id="shuffle">순서 랜덤</button><button id="delete">선택 삭제</button></div></fieldset>
<fieldset><h2>저장과 인쇄</h2><button id="save" style="width:100%">사진·글꼴 포함 백업 저장</button><label class="file">백업 불러오기<input id="load" type="file" accept=".json,application/json"></label><div class="row"><label>용지 방향<select id="page"><option value="A4 portrait">A4 세로</option><option value="A4 landscape">A4 가로</option></select></label><button id="print" class="primary">인쇄 / PDF</button></div><button id="clear" style="width:100%">새로 만들기</button><p class="hint">자동저장은 이 기기·브라우저용입니다. 작업 후 백업을 저장하세요. PDF는 인쇄 창에서 선택합니다.</p></fieldset>
</aside>
<main><div class="toolbar"><strong id="count">0개 카드</strong><button id="preview" aria-pressed="false">결과 미리보기</button></div><p id="status" role="status" aria-live="polite">준비 중…</p><section id="sheet" aria-label="그림 한글 카드"></section></main></div>
<input id="imageFile" type="file" accept="image/*" hidden>
<script>
'use strict';
const CHO=[...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
const JUNG=[...'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'];
const JONG=['',...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'];
const defaults={cons:'#e5484d',vowel:'#1769e0',font:'learning',weight:700,fontSize:64,boxShape:'10px',boxSize:'82px',boxColor:'#98a2b3',boxBorder:'2px',boxGap:'8px',longWord:'shrink',fit:'contain'};
const $=s=>document.querySelector(s);const sheet=$('#sheet');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const fresh=()=>({version:2,cards:[],columns:2,page:'A4 portrait',global:{...defaults},selected:null,customFont:null});
let state=fresh(),preview=false,imageTarget=null,db=null,saveTimer=null,saveQueue=Promise.resolve(),customFace=null,loading=false,ready=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(text,warn=false){$('#status').textContent=text;$('#status').classList.toggle('warning',warn)}
function settings(c){return {...state.global,...(c?.settings||{})}}
function splitHangul(ch){const n=ch.codePointAt(0)-0xAC00;if(n<0||n>11171)return null;return {cho:CHO[Math.floor(n/588)],jung:JUNG[Math.floor(n%588/28)],jong:JONG[n%28]}}
const strokes={
'ㄱ':[[[10,12],[90,12],[90,88]]],'ㄴ':[[[10,12],[10,88],[90,88]]],'ㄷ':[[[90,12],[10,12],[10,88],[90,88]]],
'ㄹ':[[[10,12],[90,12],[90,49],[10,49],[10,88],[90,88]]],'ㅁ':[[[10,12],[90,12],[90,88],[10,88],[10,12]]],
'ㅂ':[[[10,12],[10,88],[90,88],[90,12]],[[10,48],[90,48]]],'ㅅ':[[[50,12],[45,48],[10,88]],[[45,48],[90,88]]],
'ㅈ':[[[10,12],[90,12]],[[50,12],[45,48],[10,88]],[[45,48],[90,88]]],
'ㅊ':[[[32,4],[68,4]],[[10,28],[90,28]],[[50,28],[45,53],[10,90]],[[45,53],[90,90]]],
'ㅋ':[[[10,12],[90,12],[90,88]],[[10,49],[90,49]]],'ㅌ':[[[90,12],[10,12],[10,88],[90,88]],[[10,49],[90,49]]],
'ㅍ':[[[5,12],[95,12]],[[5,88],[95,88]],[[25,12],[25,88]],[[75,12],[75,88]]],
'ㅏ':[[[28,0],[28,100]],[[28,50],[100,50]]],'ㅑ':[[[28,0],[28,100]],[[28,32],[100,32]],[[28,68],[100,68]]],
'ㅓ':[[[72,0],[72,100]],[[0,50],[72,50]]],'ㅕ':[[[72,0],[72,100]],[[0,32],[72,32]],[[0,68],[72,68]]],
'ㅗ':[[[0,80],[100,80]],[[50,0],[50,80]]],'ㅛ':[[[0,80],[100,80]],[[32,0],[32,80]],[[68,0],[68,80]]],
'ㅜ':[[[0,20],[100,20]],[[50,20],[50,100]]],'ㅠ':[[[0,20],[100,20]],[[32,20],[32,100]],[[68,20],[68,100]]],
'ㅡ':[[[0,50],[100,50]]],'ㅣ':[[[50,0],[50,100]]]
};
const paired={'ㄲ':'ㄱㄱ','ㄸ':'ㄷㄷ','ㅃ':'ㅂㅂ','ㅆ':'ㅅㅅ','ㅉ':'ㅈㅈ','ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ','ㅐ':'ㅏㅣ','ㅒ':'ㅑㅣ','ㅔ':'ㅓㅣ','ㅖ':'ㅕㅣ'};
const mixed={'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ']};
function drawJamo(ch,box,color,s){const [x,y,w,h]=box;const sw=1.5+(Number(s.weight)-300)/600*3.8;const cap=s.font==='learning-round'?'round':'square';
if(!s.font.startsWith('learning')){const font=s.font==='custom'?'CardCustom':s.font;return `<text x="${x+w/2}" y="${y+h/2}" text-anchor="middle" dominant-baseline="central" font-family="${esc(font)},sans-serif" font-weight="${s.weight}" font-size="${h}" textLength="${w}" lengthAdjust="spacingAndGlyphs" fill="${color}">${ch}</text>`}
if(paired[ch]){const chars=[...paired[ch]];return drawJamo(chars[0],[x,y,w*.43,h],color,s)+drawJamo(chars[1],[x+w*.57,y,w*.43,h],color,s)}
if(ch==='ㅇ'||ch==='ㅎ'){let body='';let cy=y+h/2,ry=h*.39;if(ch==='ㅎ'){body=`<path d="M${x+w*.32},${y+h*.03}H${x+w*.68} M${x+w*.05},${y+h*.25}H${x+w*.95}"/>`;cy=y+h*.65;ry=h*.27}return `<g fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="${cap}">${body}<ellipse cx="${x+w/2}" cy="${cy}" rx="${w*.38}" ry="${ry}"/></g>`}
return `<g fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="${cap}" stroke-linejoin="${cap==='round'?'round':'miter'}">${(strokes[ch]||[]).map(line=>`<path d="${line.map((p,i)=>(i?'L':'M')+(x+p[0]*w/100)+','+(y+p[1]*h/100)).join(' ')}"/>`).join('')}</g>`;
}
function glyph(ch,s){const d=splitHangul(ch);if(!d){if(mixed[ch])return drawJamo(mixed[ch][0],[15,63,48,18],s.vowel,s)+drawJamo(mixed[ch][1],[72,15,20,68],s.vowel,s);if(strokes[ch]||paired[ch]||ch==='ㅇ'||ch==='ㅎ')return drawJamo(ch,[24,18,52,64],JUNG.includes(ch)?s.vowel:s.cons,s);return `<text x="50" y="55" text-anchor="middle" dominant-baseline="central" font-size="60" fill="#172033">${esc(ch)}</text>`}
let out='';const f=!!d.jong;if(mixed[d.jung]){out+=drawJamo(d.cho,f?[18,12,34,25]:[18,16,34,38],s.cons,s);out+=drawJamo(mixed[d.jung][0],f?[14,44,52,14]:[14,63,52,18],s.vowel,s);out+=drawJamo(mixed[d.jung][1],f?[72,12,20,50]:[72,14,20,71],s.vowel,s)}
else if('ㅗㅛㅜㅠㅡ'.includes(d.jung)){out+=drawJamo(d.cho,f?[29,12,42,25]:[28,15,44,38],s.cons,s);out+=drawJamo(d.jung,f?[17,44,66,15]:[16,65,68,20],s.vowel,s)}
else{out+=drawJamo(d.cho,f?[16,15,34,42]:[16,20,34,60],s.cons,s);out+=drawJamo(d.jung,f?[64,12,20,49]:[64,15,20,70],s.vowel,s)}
if(f)out+=drawJamo(d.jong,[24,76,52,16],s.cons,s);return out}
function wordLayout(word,s){const chars=[...word.normalize('NFC')];const W=560,pad=10,gap=parseFloat(s.boxGap)*1.6,base=parseFloat(s.boxSize)*1.6;const n=chars.length;const cap=Math.max(1,Math.floor((W-2*pad+gap)/(base+gap)));let size=base,g=gap,cols=n||1;if(s.longWord==='wrap')cols=Math.min(cap,n||1);else if(n){const scale=Math.min(1,(W-2*pad)/(n*base+(n-1)*gap));size*=scale;g*=scale}const rows=Math.ceil(n/cols)||1;return {chars,W,pad,size,g,cols,rows,H:Math.max(180,rows*size+(rows-1)*g+2*pad)}}
function wordSVG(word,s){const l=wordLayout(word,s);let body='';l.chars.forEach((ch,i)=>{const r=Math.floor(i/l.cols),c=i%l.cols,n=Math.min(l.cols,l.chars.length-r*l.cols);const x=(l.W-(n*l.size+(n-1)*l.g))/2+c*(l.size+l.g);const y=(l.H-(l.rows*l.size+(l.rows-1)*l.g))/2+r*(l.size+l.g);const radius=s.boxShape==='50%'?50:parseFloat(s.boxShape);const gs=Math.min(.93,Number(s.fontSize)/100);const bw=parseFloat(s.boxBorder);body+=`<svg x="${x}" y="${y}" width="${l.size}" height="${l.size}" viewBox="0 0 100 100"><rect x="${bw/2}" y="${bw/2}" width="${100-bw}" height="${100-bw}" rx="${radius}" fill="white" stroke="${s.boxColor}" stroke-width="${bw}"/><g transform="translate(${50*(1-gs)} ${50*(1-gs)}) scale(${gs})">${glyph(ch,s)}</g></svg>`});return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${l.W} ${l.H}" role="img" aria-label="${esc(word||'빈 단어')}">${body}</svg>`}
function updateUnit(unit,c){const s=settings(c);unit.querySelector('.word-area').innerHTML=wordSVG(c.word,s);const pic=unit.querySelector('.picture'),img=pic.querySelector('img');if(c.image){if(img){if(img.getAttribute('src')!==c.image)img.src=c.image;img.style.objectFit=s.fit}else{const el=document.createElement('img');el.src=c.image;el.alt=c.word;el.style.objectFit=s.fit;pic.prepend(el)}}else if(img)img.remove();const l=wordLayout(c.word,s);unit.querySelector('.layout-warning').textContent=l.size<65?'글자가 작아집니다. 1열 또는 줄바꿈을 권장합니다.':'';unit.classList.toggle('selected',state.selected===c.id)}
function renderCards(){sheet.innerHTML='';sheet.style.setProperty('--cols',state.columns);$('#count').textContent=state.cards.length+'개 카드';$('#pageStyle').textContent=`@page{size:${state.page};margin:10mm}`;
if(!state.cards.length){const e=document.createElement('div');e.className='empty';e.textContent='카드 추가를 눌러 시작하세요.';sheet.append(e)}
for(const c of state.cards){const u=document.createElement('article');u.className='unit';u.dataset.id=c.id;u.innerHTML='<div class="card"><div class="picture"><button data-action="picture">그림 넣기 / 교체</button></div><div class="word-area"></div></div><div class="editor"><input type="text" class="word-input" aria-label="단어" placeholder="단어 입력" maxlength="40"><button data-action="remove-picture">그림 삭제</button></div><p class="layout-warning"></p>';u.querySelector('input').value=c.word;sheet.append(u);updateUnit(u,c)}syncControls()}
function selectedCard(){return state.cards.find(c=>c.id===state.selected)}
function refreshSelection(){sheet.querySelectorAll('.unit').forEach(u=>u.classList.toggle('selected',u.dataset.id===state.selected));syncControls()}
function syncControls(){const s=$('#scope').value==='selected'?settings(selectedCard()):state.global;for(const k of Object.keys(defaults))$('#'+k).value=s[k];$('#columns').value=state.columns;$('#page').value=state.page;$('#weightOut').textContent=s.weight;$('#fontSizeOut').textContent=s.fontSize;$('#fontSample').innerHTML=wordSVG('차추꽃',s);$('#font').querySelector('[value="custom"]').disabled=!state.customFont;$('#delete').disabled=!selectedCard()}
function applySetting(key,value){if($('#scope').value==='selected'){const c=selectedCard();if(!c){notice('먼저 카드를 선택하세요.',true);return}c.settings[key]=value}else{state.global[key]=value;for(const c of state.cards)delete c.settings[key]}sheet.querySelectorAll('.unit').forEach(u=>updateUnit(u,state.cards.find(c=>c.id===u.dataset.id)));syncControls();scheduleSave()}
function addCard(){const c={id:uid(),word:'',image:'',settings:{}};state.cards.push(c);state.selected=c.id;renderCards();scheduleSave();sheet.lastElementChild.querySelector('input').focus()}
function safeSettings(raw,partial=false){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('설정 형식이 올바르지 않습니다.');const out=partial?{}:{...defaults};for(const k of Object.keys(defaults)){if(!(k in raw))continue;let v=raw[k];if(['cons','vowel','boxColor'].includes(k)){if(!/^#[a-f\d]{6}$/i.test(v))throw Error('색상 값 오류')}else if(k==='weight'||k==='fontSize'){v=Number(v);if(!Number.isFinite(v)||v<(k==='weight'?300:36)||v>(k==='weight'?900:100))throw Error('글자 크기 또는 두께 오류')}else{const choices={font:['learning','learning-round','Apple SD Gothic Neo','Malgun Gothic','Arial','custom','사용자 글꼴'],boxShape:['0px','10px','22px','50%'],boxSize:['70px','82px','96px'],boxBorder:['0px','1px','2px','4px'],boxGap:['4px','8px','14px'],longWord:['shrink','wrap'],fit:['contain','cover']};if(!choices[k].includes(v))throw Error('설정 값 오류');if(v==='사용자 글꼴')v='custom'}out[k]=v}return out}
function normalizeState(raw){if(!raw||!Array.isArray(raw.cards)||raw.cards.length>500)throw Error('카드 목록 오류');const next=fresh();next.global=safeSettings(raw.global||{});if(![1,2,3].includes(Number(raw.columns)))throw Error('열 수 오류');next.columns=Number(raw.columns);if(!['A4 portrait','A4 landscape'].includes(raw.page))throw Error('용지 오류');next.page=raw.page;const ids=new Set();next.cards=raw.cards.map(c=>{if(!c||typeof c.word!=='string'||[...c.word].length>40)throw Error('단어는 40자 이내여야 합니다.');if(typeof c.image!=='string'||(c.image&&!/^data:image\/(png|jpeg|jpg|gif|webp|avif|bmp);base64,[A-Za-z0-9+/=\s]+$/.test(c.image)))throw Error('이미지 형식 오류');let id=typeof c.id==='string'?c.id:uid();if(ids.has(id))id=uid();ids.add(id);return {id,word:c.word.normalize('NFC'),image:c.image,settings:safeSettings(c.settings||{},true)}});next.selected=ids.has(raw.selected)?raw.selected:next.cards[0]?.id||null;
if(raw.customFont){if(typeof raw.customFont.data!=='string'||!/^data:[^,]*;base64,[A-Za-z0-9+/=\s]+$/.test(raw.customFont.data)||raw.customFont.data.length>30000000)throw Error('글꼴 형식 오류');next.customFont={name:String(raw.customFont.name||'사용자 글꼴').slice(0,100),data:raw.customFont.data}}
if(!next.customFont){if(next.global.font==='custom')next.global.font='learning';for(const c of next.cards)if(c.settings.font==='custom')c.settings.font='learning'}return next}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('hangul-picture-cards-v2',1);req.onupgradeneeded=()=>req.result.createObjectStore('work');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('저장소가 사용 중입니다.'))})}
function dbRead(){return new Promise((resolve,reject)=>{const tx=db.transaction('work','readonly'),r=tx.objectStore('work').get('current');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbWrite(data){return new Promise((resolve,reject)=>{const tx=db.transaction('work','readwrite');tx.objectStore('work').put(data,'current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>flushSave(),300)}
function flushSave(){if(!ready)return Promise.resolve();clearTimeout(saveTimer);const data=JSON.parse(JSON.stringify(state));saveQueue=saveQueue.catch(()=>{}).then(async()=>{try{if(db)await dbWrite(data);else localStorage.setItem('hangulPictureCards',JSON.stringify(data));notice('이 기기에 자동저장됨 · 다른 기기에서 사용하려면 백업을 저장하세요.')}catch{notice('자동저장하지 못했습니다. 현재 작업은 화면에 남아 있으니 백업 저장을 눌러 주세요.',true)}});return saveQueue}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('파일 읽기 실패'));r.readAsDataURL(file)})}
async function loadFont(font){if(!font)return null;const f=new FontFace('CardCustom',`url(${font.data})`);await f.load();return f}
function installFont(face){if(customFace)document.fonts.delete(customFace);customFace=face;if(face)document.fonts.add(face)}
function selectUnit(u){if(u&&state.selected!==u.dataset.id){state.selected=u.dataset.id;refreshSelection()}}
sheet.addEventListener('focusin',e=>selectUnit(e.target.closest('.unit')));
sheet.addEventListener('click',e=>{const u=e.target.closest('.unit');if(!u)return;selectUnit(u);const c=selectedCard();if(e.target.closest('[data-action="picture"]')){imageTarget=c.id;$('#imageFile').click()}if(e.target.closest('[data-action="remove-picture"]')){c.image='';updateUnit(u,c);scheduleSave()}});
function updateWord(e){if(!e.target.matches('.word-input'))return;const u=e.target.closest('.unit'),c=state.cards.find(c=>c.id===u.dataset.id);c.word=e.target.value;updateUnit(u,c);scheduleSave()}
sheet.addEventListener('input',e=>{if(!e.isComposing)updateWord(e)});sheet.addEventListener('compositionend',updateWord);
$('#add').onclick=addCard;
for(const key of Object.keys(defaults))$('#'+key).addEventListener('input',e=>applySetting(key,['weight','fontSize'].includes(key)?Number(e.target.value):e.target.value));
$('#scope').onchange=syncControls;
$('#columns').onchange=e=>{state.columns=Number(e.target.value);renderCards();scheduleSave()};$('#page').onchange=e=>{state.page=e.target.value;renderCards();scheduleSave()};
$('#delete').onclick=()=>{if(!selectedCard())return;state.cards=state.cards.filter(c=>c.id!==state.selected);state.selected=state.cards[0]?.id||null;renderCards();scheduleSave()};
$('#shuffle').onclick=()=>{for(let i=state.cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.cards[i],state.cards[j]]=[state.cards[j],state.cards[i]]}renderCards();scheduleSave()};
$('#clear').onclick=()=>{if(!confirm('현재 카드를 모두 비울까요? 필요하면 먼저 백업을 저장하세요.'))return;state=fresh();installFont(null);renderCards();scheduleSave()};
$('#preview').onclick=()=>{preview=!preview;document.body.classList.toggle('preview-mode',preview);$('#preview').textContent=preview?'편집으로 돌아가기':'결과 미리보기';$('#preview').setAttribute('aria-pressed',String(preview))};
$('#imageFile').onchange=async e=>{const f=e.target.files[0],id=imageTarget;e.target.value='';if(!f)return;try{if(f.size>30000000)throw Error('사진은 30MB 이하로 선택해 주세요.');const data=await readFile(f);if(!/^data:image\/(png|jpeg|jpg|gif|webp|avif|bmp);base64,/.test(data))throw Error('JPG 또는 PNG 사진을 선택해 주세요. HEIC 사진은 변환이 필요합니다.');const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=()=>j(Error('이미지를 표시할 수 없습니다.'));img.src=data});const c=state.cards.find(x=>x.id===id);if(!c)return;c.image=data;renderCards();scheduleSave()}catch(err){notice(err.message,true)}};
$('#fontFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>20000000)throw Error('글꼴은 20MB 이하로 선택해 주세요.');const data=await readFile(f),font={name:f.name,data};const face=await loadFont(font);state.customFont=font;installFont(face);applySetting('font','custom')}catch{notice('글꼴을 불러오지 못했습니다. TTF·OTF·WOFF 파일을 확인해 주세요.',true)}};
$('#save').onclick=()=>{const blob=new Blob([JSON.stringify(state)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='그림한글카드_백업.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notice('백업 파일 다운로드를 요청했습니다. 사진과 불러온 글꼴이 포함됩니다.')};
$('#load').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||loading)return;if(!confirm('백업을 불러오면 현재 작업을 바꿉니다. 계속할까요?'))return;loading=true;try{if(f.size>150000000)throw Error('백업 파일이 너무 큽니다.');const next=normalizeState(JSON.parse(await f.text()));const face=await loadFont(next.customFont);state=next;installFont(face);renderCards();await flushSave()}catch(err){notice('불러오기 실패: '+err.message+' 기존 작업은 유지됩니다.',true)}finally{loading=false}};
$('#print').onclick=async()=>{try{await document.fonts.ready;await Promise.all([...sheet.querySelectorAll('img')].map(img=>img.decode()));window.print()}catch{notice('일부 사진을 읽지 못했습니다. 사진을 다시 선택한 뒤 인쇄해 주세요.',true)}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave()});window.addEventListener('pagehide',()=>flushSave());
async function init(){let stored=null,warning='';try{db=await openDB();stored=await dbRead()}catch{warning='자동저장 공간을 열지 못했습니다. 백업 저장을 이용하세요.'}try{if(!stored){const old=localStorage.getItem('hangulPictureCards');if(old)stored=JSON.parse(old)}if(stored){state=normalizeState(stored);try{installFont(await loadFont(state.customFont))}catch{state.customFont=null;state=normalizeState(state);warning='저장된 글꼴을 불러오지 못해 학습용 글자로 표시합니다.'}}}catch{warning='이전 자동저장을 읽지 못했습니다. 백업 파일을 불러와 주세요.'}renderCards();ready=true;$('.app').removeAttribute('inert');notice(warning||'카드 추가 → 그림 선택 → 단어 입력 · 사진과 글꼴은 백업에 함께 저장됩니다.',!!warning)}
init();
</script></body></html>
