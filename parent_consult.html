<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>보호자 상담용 수업내용</title>
<style>
  :root{
    --ink:#222;
    --muted:#6b7280;
    --line:#d9dde3;
    --soft:#f7f8fa;
    --accent:#4f6f8f;
    --accent-soft:#eef4f9;
    --danger:#b42318;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;
    color:var(--ink);
    background:#eef1f4;
  }
  button,input,textarea,select{font:inherit}
  .toolbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    padding:10px 12px;
    background:#fff;
    border-bottom:1px solid var(--line);
  }
  .toolbar button,.toolbar label.file-label{
    border:1px solid #c8ced6;
    background:#fff;
    border-radius:8px;
    padding:8px 11px;
    cursor:pointer;
  }
  .toolbar .primary{
    background:#26384a;
    color:#fff;
    border-color:#26384a;
  }
  .toolbar .danger{
    color:var(--danger);
  }
  .file-label input{display:none}

  .page{
    width:min(100%, 210mm);
    margin:18px auto;
    background:#fff;
    padding:14mm 12mm;
    min-height:297mm;
    box-shadow:0 4px 24px rgba(0,0,0,.08);
  }
  .editor-panel{
    border:1px solid var(--line);
    background:var(--soft);
    border-radius:12px;
    padding:14px;
    margin-bottom:18px;
  }
  .settings-grid{
    display:grid;
    grid-template-columns:1.2fr .7fr .55fr 1.2fr;
    gap:10px;
  }
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;
  }
  .field input,.field select{
    width:100%;
    min-height:38px;
    border:1px solid #c9cfd7;
    border-radius:8px;
    padding:7px 9px;
    background:#fff;
  }
  .weekday-row,.week-filter{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .weekday-row label,.week-filter label{
    display:flex;
    align-items:center;
    gap:5px;
    padding:7px 10px;
    border:1px solid #cfd5dc;
    border-radius:999px;
    background:#fff;
    cursor:pointer;
    user-select:none;
  }
  .helper{
    margin-top:9px;
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
  }

  .print-title{
    text-align:center;
    margin:0 0 14px;
  }
  .print-title h1{
    margin:0;
    font-size:23px;
    line-height:1.35;
    font-weight:800;
  }

  .weeks{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .week-section{
    border-top:2px solid #374151;
    padding-top:10px;
  }
  .week-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .week-head h2{
    margin:0;
    font-size:17px;
  }
  .week-actions{
    display:flex;
    gap:6px;
  }
  .small-btn{
    border:1px solid #c8ced6;
    background:#fff;
    border-radius:7px;
    padding:6px 9px;
    cursor:pointer;
    font-size:12px;
  }

  .session-card{
    border:1px solid #aeb6c0;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:10px;
    break-inside:avoid;
    page-break-inside:avoid;
    background:#fff;
  }
  .session-top{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    background:#f5f7f9;
    border-bottom:1px solid var(--line);
  }
  .date-display{
    font-weight:800;
    flex:1;
    min-width:0;
  }
  .date-edit{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .date-edit input[type="date"]{
    border:1px solid #c8ced6;
    border-radius:7px;
    padding:5px 7px;
  }
  .session-body{
    display:grid;
    grid-template-columns:42% 1fr;
    gap:12px;
    padding:12px;
    align-items:start;
  }
  .image-box{
    min-height:150px;
    border:1px dashed #aeb6c0;
    border-radius:8px;
    background:#fafafa;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .image-box img{
    display:block;
    width:100%;
    height:auto;
    max-height:240px;
    object-fit:contain;
  }
  .image-empty{
    color:#8a929d;
    font-size:13px;
    text-align:center;
    padding:24px;
  }
  .image-controls{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:7px;
  }
  .image-controls label,.image-controls button{
    border:1px solid #c8ced6;
    background:#fff;
    border-radius:7px;
    padding:6px 8px;
    cursor:pointer;
    font-size:12px;
  }
  .image-controls input{display:none}
  .text-wrap textarea{
    width:100%;
    min-height:180px;
    resize:vertical;
    border:1px solid #c8ced6;
    border-radius:8px;
    padding:10px;
    line-height:1.6;
  }
  .print-text{
    display:none;
    white-space:pre-wrap;
    word-break:keep-all;
    overflow-wrap:anywhere;
    line-height:1.65;
    font-size:13px;
  }
  .session-footer{
    display:flex;
    justify-content:flex-end;
    padding:0 12px 10px;
  }
  .delete-btn{
    border:0;
    background:transparent;
    color:var(--danger);
    cursor:pointer;
    font-size:12px;
  }

  .status{
    margin-left:auto;
    font-size:12px;
    color:var(--muted);
  }

  @media (max-width:800px){
    .page{margin:0; width:100%; min-height:0; padding:16px; box-shadow:none}
    .settings-grid{grid-template-columns:1fr 1fr}
    .session-body{grid-template-columns:1fr}
  }

  @page{
    size:A4 portrait;
    margin:12mm;
  }
  @media print{
    html,body{
      background:#fff!important;
      width:auto!important;
      margin:0!important;
      padding:0!important;
      -webkit-print-color-adjust:exact!important;
      print-color-adjust:exact!important;
    }
    .toolbar,.editor-panel,.screen-only,.week-actions,.date-edit,.image-controls,.session-footer{
      display:none!important;
    }
    .page{
      width:auto!important;
      min-height:0!important;
      margin:0!important;
      padding:0!important;
      box-shadow:none!important;
    }
    .print-title{
      margin-bottom:8mm;
    }
    .print-title h1{
      font-size:20px!important;
    }
    .weeks{
      gap:8mm!important;
    }
    .week-section{
      break-inside:auto;
      page-break-inside:auto;
      padding-top:3mm;
    }
    .week-section[data-print="false"]{
      display:none!important;
    }
    .week-head{
      margin-bottom:3mm;
    }
    .week-head h2{
      font-size:14px!important;
    }
    .session-card{
      break-inside:avoid!important;
      page-break-inside:avoid!important;
      margin-bottom:4mm!important;
      border-radius:6px!important;
    }
    .session-top{
      padding:2.2mm 3mm!important;
    }
    .date-display{
      font-size:12px!important;
    }
    .session-body{
      grid-template-columns:38% 1fr!important;
      gap:4mm!important;
      padding:3.5mm!important;
    }
    .image-box{
      min-height:34mm!important;
      border-style:solid!important;
      background:#fff!important;
    }
    .image-box img{
      max-height:62mm!important;
    }
    .image-empty{
      display:none!important;
    }
    .text-wrap textarea{
      display:none!important;
    }
    .print-text{
      display:block!important;
    }
  }
</style>
</head>
<body>
  <div class="toolbar screen-only">
    <button id="saveBtn" class="primary" type="button">저장</button>
    <button id="printBtn" type="button">인쇄</button>
    <button id="backupBtn" type="button">백업</button>
    <label class="file-label">복원<input id="restoreInput" type="file" accept="application/json"></label>
    <button id="resetBtn" class="danger" type="button">전체 초기화</button>
    <span id="status" class="status">자동 저장 준비</span>
  </div>

  <main class="page" id="page">
    <section class="editor-panel screen-only">
      <div class="settings-grid">
        <div class="field">
          <label for="childName">아동이름</label>
          <input id="childName" type="text" value="아동이름" />
        </div>
        <div class="field">
          <label for="year">연도</label>
          <select id="year"></select>
        </div>
        <div class="field">
          <label for="month">월</label>
          <select id="month"></select>
        </div>
        <div class="field">
          <label for="contentTitle">타이틀 글자</label>
          <input id="contentTitle" type="text" value="수업내용" />
        </div>
      </div>

      <div class="helper">기본 수업 요일을 선택하면 해당 연·월의 날짜가 주차별로 자동 생성됩니다. 자동 생성 후 각 회기의 날짜는 보강 등에 맞게 직접 수정할 수 있습니다.</div>
      <div class="weekday-row" id="weekdayRow"></div>

      <div class="helper" style="margin-top:14px">보호자에게 인쇄할 주차를 선택하세요. 선택을 해제해도 작성한 내용은 삭제되지 않습니다.</div>
      <div class="week-filter" id="weekFilter"></div>
    </section>

    <header class="print-title">
      <h1 id="titlePreview"></h1>
    </header>

    <section class="weeks" id="weeks"></section>
  </main>

<script>
(() => {
  const STORAGE_KEY = "slp_parent_consult_v1";
  const DAYS = ["일","월","화","수","목","금","토"];
  const WEEKDAY_OPTIONS = [
    {value:1,label:"월"},
    {value:2,label:"화"},
    {value:3,label:"수"},
    {value:4,label:"목"},
    {value:5,label:"금"},
    {value:6,label:"토"},
    {value:0,label:"일"}
  ];

  const el = id => document.getElementById(id);
  const childName = el("childName");
  const yearSel = el("year");
  const monthSel = el("month");
  const contentTitle = el("contentTitle");
  const weekdayRow = el("weekdayRow");
  const weekFilter = el("weekFilter");
  const titlePreview = el("titlePreview");
  const weeksEl = el("weeks");
  const statusEl = el("status");

  let saveTimer = null;
  let state = makeDefaultState();

  function makeDefaultState(){
    const now = new Date();
    return {
      childName:"아동이름",
      titleText:"수업내용",
      year:now.getFullYear(),
      month:now.getMonth()+1,
      weekdays:[],
      includedWeeks:{},
      weeks:{}
    };
  }

  function pad2(n){ return String(n).padStart(2,"0"); }
  function isoDate(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }

  function parseIso(s){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if(!m) return null;
    return {y:+m[1],m:+m[2],d:+m[3]};
  }

  function formatDate(s){
    const p = parseIso(s);
    if(!p) return "날짜 미지정";
    const dt = new Date(p.y, p.m-1, p.d);
    return `${p.m}월 ${p.d}일 (${DAYS[dt.getDay()]})`;
  }

  function weekInfo(year,month){
    const first = new Date(year, month-1, 1);
    const lastDay = new Date(year, month, 0).getDate();
    const offset = (first.getDay()+6)%7; // 월=0 기준
    const count = Math.ceil((offset + lastDay)/7);
    const infos = [];
    for(let i=0;i<count;i++){
      const startDay = 1 - offset + i*7;
      const endDay = startDay + 6;
      infos.push({
        index:i+1,
        monthStart:Math.max(1,startDay),
        monthEnd:Math.min(lastDay,endDay)
      });
    }
    return infos;
  }

  function calcWeekIndex(year,month,day){
    const first = new Date(year, month-1, 1);
    const offset = (first.getDay()+6)%7;
    return Math.floor((offset + day - 1)/7)+1;
  }

  function autoDatesForWeek(year,month,weekIndex,weekdays){
    const lastDay = new Date(year, month, 0).getDate();
    const out = [];
    for(let d=1;d<=lastDay;d++){
      const dt = new Date(year,month-1,d);
      if(calcWeekIndex(year,month,d)===weekIndex && weekdays.includes(dt.getDay())){
        out.push(isoDate(year,month,d));
      }
    }
    return out;
  }

  function newSession(date, autoGenerated=true){
    return {
      id:`s_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,
      date:date || "",
      autoGenerated,
      text:"",
      image:""
    };
  }

  function populateSelectors(){
    const now = new Date();
    const start = now.getFullYear()-3;
    const end = now.getFullYear()+5;
    yearSel.innerHTML = "";
    for(let y=start;y<=end;y++){
      const o=document.createElement("option");
      o.value=y; o.textContent=`${y}년`;
      yearSel.appendChild(o);
    }
    monthSel.innerHTML="";
    for(let m=1;m<=12;m++){
      const o=document.createElement("option");
      o.value=m; o.textContent=`${m}월`;
      monthSel.appendChild(o);
    }

    weekdayRow.innerHTML="";
    WEEKDAY_OPTIONS.forEach(w=>{
      const label=document.createElement("label");
      const cb=document.createElement("input");
      cb.type="checkbox";
      cb.value=String(w.value);
      cb.addEventListener("change",()=>{
        state.weekdays = [...weekdayRow.querySelectorAll("input:checked")].map(x=>+x.value);
        regenerateAutoSessions();
        scheduleSave();
      });
      label.append(cb, document.createTextNode(`${w.label}요일`));
      weekdayRow.appendChild(label);
    });
  }

  function ensureWeekStructures(){
    const infos = weekInfo(state.year,state.month);
    const valid = new Set(infos.map(x=>String(x.index)));

    Object.keys(state.weeks).forEach(k=>{
      if(!valid.has(k)) delete state.weeks[k];
    });
    Object.keys(state.includedWeeks).forEach(k=>{
      if(!valid.has(k)) delete state.includedWeeks[k];
    });

    infos.forEach(info=>{
      const k=String(info.index);
      if(!Array.isArray(state.weeks[k])) state.weeks[k]=[];
      if(typeof state.includedWeeks[k] !== "boolean") state.includedWeeks[k]=true;
    });
  }

  function regenerateAutoSessions(){
    ensureWeekStructures();
    const infos = weekInfo(state.year,state.month);

    infos.forEach(info=>{
      const k=String(info.index);
      const sessions = state.weeks[k] || [];
      // 사용자가 수정했거나 작성한 기록은 보존. 비어 있는 자동 생성 회기만 재구성.
      const preserved = sessions.filter(s => !s.autoGenerated || s.text || s.image);
      const occupiedDates = new Set(preserved.map(s=>s.date).filter(Boolean));
      const autoDates = autoDatesForWeek(state.year,state.month,info.index,state.weekdays);

      const freshAuto = autoDates
        .filter(d=>!occupiedDates.has(d))
        .map(d=>newSession(d,true));

      state.weeks[k] = [...preserved, ...freshAuto].sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
    });
    renderAll();
  }

  function renderWeekFilter(){
    weekFilter.innerHTML="";
    weekInfo(state.year,state.month).forEach(info=>{
      const k=String(info.index);
      const label=document.createElement("label");
      const cb=document.createElement("input");
      cb.type="checkbox";
      cb.checked=state.includedWeeks[k] !== false;
      cb.addEventListener("change",()=>{
        state.includedWeeks[k]=cb.checked;
        const sec = weeksEl.querySelector(`[data-week="${k}"]`);
        if(sec) sec.dataset.print=String(cb.checked);
        scheduleSave();
      });
      label.append(cb, document.createTextNode(`${info.index}주`));
      weekFilter.appendChild(label);
    });
  }

  function renderAll(){
    childName.value=state.childName;
    contentTitle.value=state.titleText;
    yearSel.value=String(state.year);
    monthSel.value=String(state.month);

    weekdayRow.querySelectorAll("input").forEach(cb=>{
      cb.checked=state.weekdays.includes(+cb.value);
    });

    titlePreview.textContent=`${state.childName} ${state.month}월 ${state.titleText}`;
    renderWeekFilter();
    renderWeeks();
  }

  function renderWeeks(){
    weeksEl.innerHTML="";
    weekInfo(state.year,state.month).forEach(info=>{
      const k=String(info.index);
      const sec=document.createElement("section");
      sec.className="week-section";
      sec.dataset.week=k;
      sec.dataset.print=String(state.includedWeeks[k] !== false);

      const head=document.createElement("div");
      head.className="week-head";

      const h2=document.createElement("h2");
      h2.textContent=`${info.index}주`;

      const actions=document.createElement("div");
      actions.className="week-actions screen-only";
      const add=document.createElement("button");
      add.type="button";
      add.className="small-btn";
      add.textContent="+ 수업 추가";
      add.addEventListener("click",()=>{
        state.weeks[k].push(newSession("",false));
        renderWeeks();
        scheduleSave();
      });
      actions.appendChild(add);
      head.append(h2,actions);
      sec.appendChild(head);

      const sessions=state.weeks[k] || [];
      if(sessions.length===0){
        const empty=document.createElement("div");
        empty.className="screen-only";
        empty.style.color="#7a828d";
        empty.style.fontSize="13px";
        empty.style.padding="4px 0 8px";
        empty.textContent="이 주차에는 자동 생성된 수업이 없습니다. 필요하면 ‘+ 수업 추가’를 눌러주세요.";
        sec.appendChild(empty);
      }

      sessions.forEach(s=>sec.appendChild(makeSessionCard(k,s)));
      weeksEl.appendChild(sec);
    });
  }

  function makeSessionCard(weekKey,s){
    const card=document.createElement("article");
    card.className="session-card";

    const top=document.createElement("div");
    top.className="session-top";

    const disp=document.createElement("div");
    disp.className="date-display";
    disp.textContent=formatDate(s.date);

    const dateEdit=document.createElement("div");
    dateEdit.className="date-edit screen-only";
    const dateInput=document.createElement("input");
    dateInput.type="date";
    dateInput.value=s.date || "";
    dateInput.addEventListener("change",()=>{
      s.date=dateInput.value;
      s.autoGenerated=false; // 수동 변경 날짜는 이후 자동 재생성에서 보존
      disp.textContent=formatDate(s.date);
      scheduleSave();
    });
    dateEdit.appendChild(dateInput);
    top.append(disp,dateEdit);

    const body=document.createElement("div");
    body.className="session-body";

    const imageCol=document.createElement("div");
    const imageBox=document.createElement("div");
    imageBox.className="image-box";
    if(s.image){
      const img=document.createElement("img");
      img.src=s.image;
      img.alt="수업 이미지";
      imageBox.appendChild(img);
    }else{
      const empty=document.createElement("div");
      empty.className="image-empty";
      empty.textContent="이미지를 추가할 수 있습니다.";
      imageBox.appendChild(empty);
    }
    const imageControls=document.createElement("div");
    imageControls.className="image-controls screen-only";

    const uploadLabel=document.createElement("label");
    uploadLabel.textContent=s.image ? "이미지 변경" : "이미지 추가";
    const file=document.createElement("input");
    file.type="file";
    file.accept="image/*";
    file.addEventListener("change", async ()=>{
      if(!file.files || !file.files[0]) return;
      try{
        s.image=await compressImage(file.files[0],1400,0.78);
        renderWeeks();
        scheduleSave();
      }catch(err){
        alert("이미지를 불러오지 못했습니다.");
      }
    });
    uploadLabel.appendChild(file);
    imageControls.appendChild(uploadLabel);

    if(s.image){
      const removeImg=document.createElement("button");
      removeImg.type="button";
      removeImg.textContent="이미지 삭제";
      removeImg.addEventListener("click",()=>{
        s.image="";
        renderWeeks();
        scheduleSave();
      });
      imageControls.appendChild(removeImg);
    }
    imageCol.append(imageBox,imageControls);

    const textCol=document.createElement("div");
    textCol.className="text-wrap";
    const ta=document.createElement("textarea");
    ta.placeholder="보호자에게 전달할 수업 내용을 입력하세요.";
    ta.value=s.text || "";
    const printText=document.createElement("div");
    printText.className="print-text";
    printText.textContent=s.text || "";
    ta.addEventListener("input",()=>{
      s.text=ta.value;
      printText.textContent=s.text;
      scheduleSave();
    });
    textCol.append(ta,printText);

    body.append(imageCol,textCol);

    const footer=document.createElement("div");
    footer.className="session-footer screen-only";
    const del=document.createElement("button");
    del.type="button";
    del.className="delete-btn";
    del.textContent="이 수업 블록 삭제";
    del.addEventListener("click",()=>{
      if(confirm("이 수업 블록을 삭제할까요?")){
        state.weeks[weekKey]=state.weeks[weekKey].filter(x=>x.id!==s.id);
        renderWeeks();
        scheduleSave();
      }
    });
    footer.appendChild(del);

    card.append(top,body,footer);
    return card;
  }

  function compressImage(file,maxDim,quality){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onerror=reject;
      reader.onload=()=>{
        const img=new Image();
        img.onerror=reject;
        img.onload=()=>{
          let w=img.naturalWidth, h=img.naturalHeight;
          const scale=Math.min(1,maxDim/Math.max(w,h));
          w=Math.max(1,Math.round(w*scale));
          h=Math.max(1,Math.round(h*scale));
          const canvas=document.createElement("canvas");
          canvas.width=w; canvas.height=h;
          const ctx=canvas.getContext("2d");
          ctx.drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL("image/jpeg",quality));
        };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function gatherTop(){
    state.childName=childName.value.trim() || "아동이름";
    state.titleText=contentTitle.value.trim() || "수업내용";
    state.year=+yearSel.value;
    state.month=+monthSel.value;
    titlePreview.textContent=`${state.childName} ${state.month}월 ${state.titleText}`;
  }

  function saveState(show=true){
    gatherTop();
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      if(show) setStatus("저장됨");
    }catch(err){
      alert("저장 공간이 부족합니다. 이미지 수를 줄이거나 백업 후 오래된 이미지를 삭제해주세요.");
      setStatus("저장 실패");
    }
  }

  function loadState(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw){
        const loaded=JSON.parse(raw);
        state=Object.assign(makeDefaultState(),loaded);
        if(!state.weeks || typeof state.weeks!=="object") state.weeks={};
        if(!state.includedWeeks || typeof state.includedWeeks!=="object") state.includedWeeks={};
        if(!Array.isArray(state.weekdays)) state.weekdays=[];
      }
    }catch(e){
      state=makeDefaultState();
    }
    ensureWeekStructures();
    renderAll();
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    setStatus("변경사항 저장 중...");
    saveTimer=setTimeout(()=>saveState(false),500);
  }

  function setStatus(msg){
    statusEl.textContent=msg;
    if(msg!=="자동 저장 준비"){
      clearTimeout(setStatus._t);
      setStatus._t=setTimeout(()=>{statusEl.textContent="자동 저장됨";},1200);
    }
  }

  childName.addEventListener("input",()=>{gatherTop();scheduleSave();});
  contentTitle.addEventListener("input",()=>{gatherTop();scheduleSave();});
  yearSel.addEventListener("change",()=>{
    gatherTop();
    ensureWeekStructures();
    regenerateAutoSessions();
    scheduleSave();
  });
  monthSel.addEventListener("change",()=>{
    gatherTop();
    ensureWeekStructures();
    regenerateAutoSessions();
    scheduleSave();
  });

  el("saveBtn").addEventListener("click",()=>saveState(true));
  el("printBtn").addEventListener("click",()=>{
    saveState(false);
    window.print();
  });

  el("backupBtn").addEventListener("click",()=>{
    saveState(false);
    const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${state.childName}_${state.year}_${pad2(state.month)}_상담자료_백업.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });

  el("restoreInput").addEventListener("change",async e=>{
    const file=e.target.files && e.target.files[0];
    if(!file) return;
    try{
      const loaded=JSON.parse(await file.text());
      state=Object.assign(makeDefaultState(),loaded);
      if(!state.weeks || typeof state.weeks!=="object") state.weeks={};
      if(!state.includedWeeks || typeof state.includedWeeks!=="object") state.includedWeeks={};
      if(!Array.isArray(state.weekdays)) state.weekdays=[];
      ensureWeekStructures();
      renderAll();
      saveState(true);
    }catch(err){
      alert("올바른 백업 파일이 아닙니다.");
    }finally{
      e.target.value="";
    }
  });

  el("resetBtn").addEventListener("click",()=>{
    if(!confirm("작성한 수업 내용과 이미지를 모두 초기화할까요?")) return;
    localStorage.removeItem(STORAGE_KEY);
    state=makeDefaultState();
    ensureWeekStructures();
    renderAll();
    saveState(false);
  });

  populateSelectors();
  loadState();
})();
</script>
</body>
</html>
