<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>그림 찾기 활동지 제작 도구</title>
  <meta name="description" content="그림을 보고, 듣고, 읽고 찾는 A4 활동지를 만드는 도구">
  <style>:root{--ink:#182230;--muted:#64748b;--line:#d9e0e8;--blue:#246bfd;--blue-soft:#eef4ff;--paper:#fff;--bg:#edf2f7;--danger:#c43d4b}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);font-size:16px}.topbar{height:76px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}.topbar h1{font-size:21px;margin:0 0 3px}.topbar p{font-size:14px;color:var(--muted);margin:0}.top-actions{display:flex;gap:8px}button,select,input,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;color:var(--ink)}button:hover{border-color:#9aacbf}.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}.ghost{background:#f8fafc}.danger{color:var(--danger)}.workspace{display:grid;grid-template-columns:340px minmax(560px,1fr);min-height:calc(100vh - 76px)}.panel{background:#fff;border-right:1px solid var(--line);padding:18px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panel-head strong{font-size:18px}.panel-head span{font-size:12px;color:#16805d;background:#e9f9f2;border-radius:20px;padding:5px 8px}.panel label{display:block;font-weight:700;font-size:14px;margin:13px 0 0}.panel input[type=file],.panel textarea,.panel select{width:100%;margin-top:7px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:9px}.panel textarea{resize:vertical;line-height:1.5}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}fieldset{border:0;padding:0;margin:16px 0 0}legend{font-size:14px;font-weight:700;margin-bottom:7px}.segmented{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#eef2f6;padding:3px;border-radius:10px}.segmented button{border:0;background:transparent;padding:8px 5px;font-size:13px}.segmented button.active{background:#fff;color:#1558cf;box-shadow:0 1px 5px #cbd5e1;font-weight:700}.sliders output{float:right;color:var(--blue)}input[type=range]{accent-color:var(--blue);padding:0}.checks{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}.checks label{font-weight:500}.checks input{margin-right:7px}.cut-actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-top:17px}.cut-actions button{padding:8px 3px;font-size:12px}.preview-wrap{padding:18px 24px 48px;overflow:auto}.preview-title{display:flex;align-items:baseline;gap:10px;max-width:794px;margin:0 auto 12px}.preview-title span{font-size:13px;color:var(--muted)}.pages{display:flex;flex-direction:column;gap:24px;align-items:center}.sheet{width:794px;height:1123px;background:var(--paper);box-shadow:0 7px 24px #9eacbc55;padding:40px;position:relative;cursor:pointer;border:3px solid transparent;overflow:hidden}.sheet.active{border-color:var(--blue)}.sheet-index{position:absolute;right:12px;top:10px;color:#94a3b8;font-size:12px}.worksheet-header{height:44px;display:grid;grid-template-columns:1fr 150px 150px;gap:10px;align-items:end;margin-bottom:12px}.worksheet-header .title-line,.worksheet-header .meta-line{border-bottom:1px solid #334155;padding:0 5px 5px}.visual{width:100%;background:#f7f9fb;border:1px solid #d7dee7;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#94a3b8}.visual.large{height:710px}.visual.medium{height:620px}.visual.small{height:530px}.visual img{width:100%;height:100%;display:block}.visual img.contain{object-fit:contain}.visual img.cover{object-fit:cover}.placeholder{font-size:19px;text-align:center}.word-grid{display:grid;margin-top:10px;border:1.4px solid #111;border-right:0;min-height:58px}.word-cell{border-right:1.4px solid #111;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;min-width:0;line-height:1.25}.questions{margin-top:28px;display:flex;flex-direction:column;gap:.42em;line-height:1.45}.question-row{min-height:1.45em}.add-cut{display:block;margin:24px auto 0;background:#fff;border:2px dashed #a6b5c5;color:#2458a5;width:794px;padding:16px;font-weight:700}.teacher-sheet{cursor:default}.teacher-image{height:330px;width:330px;margin:15px auto;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}.teacher-image img{width:100%;height:100%;object-fit:contain}.teacher-list{margin-top:30px;border-top:2px solid #172033}.teacher-row{display:grid;grid-template-columns:42px 1fr 180px;border-bottom:1px solid var(--line);min-height:58px;align-items:center}.teacher-row>*{padding:12px}.teacher-row .answer{border-left:1px solid var(--line);font-weight:700;color:#145bbf}.empty-note{color:var(--muted)}dialog{border:0;border-radius:16px;padding:0;box-shadow:0 20px 70px #1c29434d;width:min(440px,calc(100% - 32px))}dialog::backdrop{background:#11183}dialog form{padding:24px}dialog h2{font-size:20px;margin:0 0 18px}.radio-card{display:flex;border:1px solid var(--line);border-radius:10px;padding:13px;margin:9px 0;gap:10px;align-items:flex-start}.radio-card span{display:flex;flex-direction:column;gap:4px}.radio-card small{color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:1050px){.workspace{grid-template-columns:310px minmax(440px,1fr)}.sheet,.add-cut{width:620px}.sheet{height:877px;padding:30px}.visual.large{height:530px}.visual.medium{height:465px}.visual.small{height:400px}}
@media(max-width:760px){.topbar{height:auto;align-items:flex-start;padding:12px}.topbar p{display:none}.workspace{display:block}.panel{position:static;height:auto;border-right:0}.preview-wrap{padding:16px 8px}.sheet,.add-cut{width:100%}.sheet{height:auto;min-height:690px;padding:24px}.visual.large{height:58vw}.visual.medium{height:50vw}.visual.small{height:42vw}.top-actions button{padding:8px;font-size:13px}}
@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.topbar,.panel,.preview-title,.add-cut{display:none!important}.workspace{display:block}.preview-wrap{padding:0}.pages{gap:0}.sheet{width:210mm;height:297mm;padding:10mm;box-shadow:none;border:0!important;page-break-after:always;display:none}.sheet.print-visible{display:block}.sheet-index{display:none}.visual.large{height:188mm}.visual.medium{height:164mm}.visual.small{height:140mm}.teacher-image{height:90mm;width:90mm}}

.teacher-sheet{display:none}
@media print{.sheet.print-visible{display:block}}
.order-list{margin-top:8px;display:grid;gap:5px}.order-row{display:grid;grid-template-columns:1fr 34px 34px;gap:4px;align-items:center;font-size:12px;color:#475569}.order-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.order-row button{padding:4px;border-radius:6px;font-size:12px}
</style>
  <link rel="stylesheet" href="./fixes.css">
</head>
<body>
  <header class="topbar">
    <div><h1>그림 찾기 활동지</h1><p>컷별로 그림, 낱말, 질문을 입력해 A4 자료를 만드세요.</p></div>
    <div class="top-actions">
      <button class="ghost" id="saveBtn">저장</button>
      <button class="ghost" id="loadBtn">불러오기</button>
      <input id="loadFile" type="file" accept="application/json" hidden>
      <button class="primary" id="printBtn">인쇄하기</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel" aria-label="활동지 설정">
      <div class="panel-head"><strong id="cutLabel">1컷 설정</strong><span id="pageStatus">여유 있음</span></div>
      <label>그림
        <input id="imageInput" type="file" accept="image/*">
      </label>
      <div class="field-row">
        <label>그림 맞춤<select id="imageFit"><option value="contain">전체 보기</option><option value="cover">영역 채우기</option></select></label>
        <label>그림 크기<select id="imageSize"><option value="large">가장 크게</option><option value="medium">중간</option><option value="small">작게</option></select></label>
      </div>

      <fieldset><legend>문항 수준</legend><div class="segmented" id="levelGroup">
        <button data-value="word">단어</button><button data-value="sentence">문장</button><button data-value="both">단어+문장</button>
      </div></fieldset>
      <fieldset id="wordModeField"><legend>단어 칸</legend><div class="segmented" id="wordModeGroup">
        <button data-value="show">단어 보이기</button><button data-value="blank">빈칸으로 두기</button>
      </div></fieldset>
      <fieldset id="questionModeField"><legend>아동용 질문</legend><div class="segmented" id="questionModeGroup">
        <button data-value="show">읽고 찾기 · 보이기</button><button data-value="hide">듣고 찾기 · 숨기기</button>
      </div></fieldset>

      <label id="wordsField">단어 <span class="hint">쉼표 또는 줄바꿈으로 구분, 최대 8개</span>
        <textarea id="wordsInput" rows="3" placeholder="비닐봉지, 아이, 엄마, 문, 액자"></textarea>
      </label>
      <label id="wordsPerRowField">한 줄에 들어갈 단어 수
        <select id="wordsPerRow"><option value="2">2개</option><option value="3">3개</option><option value="4">4개</option><option value="5">5개</option><option value="6">6개</option><option value="7">7개</option><option value="8">8개</option></select>
      </label>
      <div id="wordOrder" class="order-list"></div>
      <label id="questionsField">질문 <span class="hint">한 줄에 한 문항, 최대 6개</span>
        <textarea id="questionsInput" rows="6" placeholder="엄마가 들고 있는 것은?&#10;아이가 보고 있는 것은?"></textarea>
      </label>
      <div id="questionOrder" class="order-list"></div>
      <label id="answersField">정답 <span class="hint">질문 순서대로 한 줄씩</span>
        <textarea id="answersInput" rows="3" placeholder="비닐봉지&#10;비닐봉지"></textarea>
      </label>

      <div class="field-row sliders">
        <label>단어 글자 <output id="wordFontOut">18pt</output><input id="wordFont" type="range" min="14" max="28" step="1"></label>
        <label>질문 글자 <output id="questionFontOut">18pt</output><input id="questionFont" type="range" min="14" max="24" step="1"></label>
      </div>
      <div class="checks">
        <label><input id="showHeader" type="checkbox"> 제목·이름·날짜 칸</label>
        <label><input id="numberQuestions" type="checkbox"> 질문 번호 표시</label>
      </div>
      <div class="cut-actions">
        <button id="moveUp">↑ 위로</button><button id="moveDown">↓ 아래로</button><button id="duplicateCut">복제</button><button class="danger" id="deleteCut">삭제</button>
      </div>
    </aside>

    <section class="preview-wrap">
      <div class="preview-title"><strong>활동지 미리보기</strong><span>편집할 컷을 클릭하세요.</span></div>
      <div id="pages" class="pages"></div>
      <button id="addCut" class="add-cut">＋ 컷 추가</button>
    </section>
  </main>

  <dialog id="printDialog">
    <form method="dialog">
      <h2>인쇄할 자료를 선택하세요</h2>
      <label class="radio-card"><input type="radio" name="printMode" value="student" checked><span><b>아동용 활동지</b><small>그림과 선택한 단어·문장 영역</small></span></label>
      <label class="radio-card"><input type="radio" name="printMode" value="teacher"><span><b>교사용 자료</b><small>문항과 정답을 함께 표시</small></span></label>
      <label class="radio-card"><input type="radio" name="printMode" value="both"><span><b>아동용+교사용</b><small>아동용 다음에 교사용을 인쇄</small></span></label>
      <div class="dialog-actions"><button value="cancel">취소</button><button id="confirmPrint" class="primary" value="default">인쇄</button></div>
    </form>
  </dialog>

  <script>const $=s=>document.querySelector(s),pages=$("#pages");
const blankCut=(sample=false)=>({id:crypto.randomUUID(),image:sample?"./assets/sample.png":"",imageFit:"contain",imageSize:"large",level:"both",wordMode:"show",questionMode:"show",wordsPerRow:5,words:sample?["비닐봉지","아이","엄마","문","액자"]:[],questions:sample?["엄마가 들고 있는 것은?","아이가 보고 있는 것은?","아이가 입고 있는 옷은?"]:[],answers:sample?["비닐봉지","비닐봉지","초록색 옷"]:[],wordFont:18,questionFont:18,showHeader:false,numberQuestions:false});
let cuts=[blankCut(false)],active=0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const splitWords=v=>v.split(/[,\n]/).map(x=>x.trim()).filter(Boolean).slice(0,8);
function sheetHTML(c,i,teacher=false){
 const image=c.image?`<img class="${c.imageFit}" src="${c.image}" alt="활동 그림">`:'<div class="placeholder">그림을 추가하세요</div>';
 if(teacher){const qs=c.questions.length?c.questions:["문항을 입력하세요"];return `<article class="sheet teacher-sheet" data-teacher="${i}"><span class="sheet-index">교사용 · ${i+1}컷</span><h2>교사용 자료</h2><div class="teacher-image">${image}</div><div class="teacher-list">${qs.map((q,n)=>`<div class="teacher-row"><b>${n+1}</b><span>${esc(q)}</span><span class="answer">정답: ${esc(c.answers[n]||"")}</span></div>`).join("")}</div></article>`;}
 const header=c.showHeader?'<div class="worksheet-header"><div class="title-line">제목:</div><div class="meta-line">이름:</div><div class="meta-line">날짜:</div></div>':"";
 const words=c.level!=="sentence"?`<div class="word-grid" style="grid-template-columns:repeat(${Math.max(1,Math.min(c.wordsPerRow||5,c.words.length||1))},1fr);font-size:${c.wordFont}pt">${(c.words.length?c.words:[""]).map(w=>`<div class="word-cell">${c.wordMode==="show"?esc(w):"&nbsp;"}</div>`).join("")}</div>`:"";
 const questions=c.level!=="word"&&c.questionMode!=="hide"?`<div class="questions" style="font-size:${c.questionFont}pt">${c.questions.map((q,n)=>`<div class="question-row">${c.numberQuestions?`${n+1}. `:""}${esc(q)}</div>`).join("")}</div>`:"";
 return `<article class="sheet ${i===active?"active":""}" data-index="${i}"><span class="sheet-index">${i+1}컷</span>${header}<div class="visual ${c.imageSize}">${image}</div>${words}${questions}</article>`;
}
function activate(s,v){document.querySelectorAll(s+" button").forEach(b=>b.classList.toggle("active",b.dataset.value===v))}
function sync(){const c=cuts[active];c.questionMode??="show";$("#cutLabel").textContent=`${active+1}컷 설정`;$("#imageFit").value=c.imageFit;$("#imageSize").value=c.imageSize;$("#wordsInput").value=c.words.join(", ");$("#questionsInput").value=c.questions.join("\n");$("#answersInput").value=c.answers.join("\n");$("#wordFont").value=c.wordFont;$("#questionFont").value=c.questionFont;$("#wordFontOut").textContent=c.wordFont+"pt";$("#questionFontOut").textContent=c.questionFont+"pt";$("#showHeader").checked=c.showHeader;$("#numberQuestions").checked=c.numberQuestions;activate("#levelGroup",c.level);activate("#wordModeGroup",c.wordMode);activate("#questionModeGroup",c.questionMode);$("#wordModeField").hidden=c.level==="sentence";$("#wordsField").hidden=c.level==="sentence";$("#questionModeField").hidden=c.level==="word";$("#questionsField").hidden=c.level==="word";$("#answersField").hidden=c.level==="word";const risk=(c.questions.length>5&&c.questionFont>20)||(c.words.length>6&&c.wordFont>23);$("#pageStatus").textContent=risk?"공간 확인 필요":"여유 있음";$("#pageStatus").style.color=risk?"#b45309":"#16805d";}
function render(){pages.innerHTML=cuts.map((c,i)=>sheetHTML(c,i)).join("")+cuts.map((c,i)=>sheetHTML(c,i,true)).join("");document.querySelectorAll("[data-index]").forEach(x=>x.onclick=()=>{active=+x.dataset.index;render()});sync();renderOrders()}
function set(k,v){cuts[active][k]=v;render()}
function moveItem(key,index,direction){const items=cuts[active][key],target=index+direction;if(target<0||target>=items.length)return;[items[index],items[target]]=[items[target],items[index]];render()}
function renderOrders(){const c=cuts[active];c.wordsPerRow??=5;$("#wordsPerRow").value=c.wordsPerRow;const make=(key,target)=>{const items=c[key];$(target).innerHTML=items.map((item,i)=>`<div class="order-row"><span>${i+1}. ${esc(item)}</span><button data-key="${key}" data-i="${i}" data-d="-1" aria-label="위로">↑</button><button data-key="${key}" data-i="${i}" data-d="1" aria-label="아래로">↓</button></div>`).join("");};make("words","#wordOrder");make("questions","#questionOrder");document.querySelectorAll(".order-row button").forEach(b=>b.onclick=()=>moveItem(b.dataset.key,+b.dataset.i,+b.dataset.d));}
document.querySelectorAll("#levelGroup button").forEach(b=>b.onclick=()=>set("level",b.dataset.value));document.querySelectorAll("#wordModeGroup button").forEach(b=>b.onclick=()=>set("wordMode",b.dataset.value));document.querySelectorAll("#questionModeGroup button").forEach(b=>b.onclick=()=>set("questionMode",b.dataset.value));
$("#imageInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>set("image",r.result);r.readAsDataURL(f)};$("#imageFit").onchange=e=>set("imageFit",e.target.value);$("#imageSize").onchange=e=>set("imageSize",e.target.value);
$("#wordsPerRow").onchange=e=>set("wordsPerRow",+e.target.value);
$("#wordsInput").onchange=e=>set("words",splitWords(e.target.value));$("#questionsInput").onchange=e=>set("questions",e.target.value.split("\n").slice(0,6));$("#answersInput").onchange=e=>set("answers",e.target.value.split("\n").slice(0,6));["wordFont","questionFont"].forEach(id=>$("#"+id).oninput=e=>set(id,+e.target.value));["showHeader","numberQuestions"].forEach(id=>$("#"+id).onchange=e=>set(id,e.target.checked));
$("#addCut").onclick=()=>{cuts.push(blankCut());active=cuts.length-1;render();setTimeout(()=>document.querySelector(`[data-index="${active}"]`).scrollIntoView({behavior:"smooth"}),30)};$("#duplicateCut").onclick=()=>{const copy=structuredClone(cuts[active]);copy.id=crypto.randomUUID();cuts.splice(active+1,0,copy);active++;render()};$("#deleteCut").onclick=()=>{if(cuts.length===1){alert("최소 한 컷은 남겨 주세요.");return}if(confirm("이 컷을 삭제할까요?")){cuts.splice(active,1);active=Math.min(active,cuts.length-1);render()}};$("#moveUp").onclick=()=>{if(active<1)return;[cuts[active-1],cuts[active]]=[cuts[active],cuts[active-1]];active--;render()};$("#moveDown").onclick=()=>{if(active>=cuts.length-1)return;[cuts[active+1],cuts[active]]=[cuts[active],cuts[active+1]];active++;render()};
$("#saveBtn").onclick=()=>{const blob=new Blob([JSON.stringify({version:1,cuts},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="그림찾기-활동지.json";a.click();URL.revokeObjectURL(a.href)};$("#loadBtn").onclick=()=>$("#loadFile").click();$("#loadFile").onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.cuts)||!data.cuts.length)throw 0;cuts=data.cuts;active=0;render()}catch{alert("활동지 저장 파일을 확인해 주세요.")}};
$("#printBtn").onclick=()=>$("#printDialog").showModal();$("#confirmPrint").onclick=()=>{const mode=document.querySelector('[name="printMode"]:checked').value;document.querySelectorAll(".print-visible").forEach(s=>s.classList.remove("print-visible"));if(mode==="student"||mode==="both")document.querySelectorAll("[data-index]").forEach(s=>s.classList.add("print-visible"));if(mode==="teacher"||mode==="both")document.querySelectorAll("[data-teacher]").forEach(s=>s.classList.add("print-visible"));$("#printDialog").close();setTimeout(()=>window.print(),50)};
render();
</script>
</body>
</html>
