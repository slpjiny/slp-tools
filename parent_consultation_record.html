<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>보호자 상담기록</title>
  <style>
    :root{--ink:#24303b;--muted:#667582;--line:#d9e0e5;--blue:#3f7f9d;--blue-soft:#edf6fa;--paper:#fff;--bg:#f3f6f8}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;line-height:1.55}
    .app{max-width:1060px;margin:0 auto;padding:24px 18px 64px}.editor{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 2px 14px #2534410b}.editor h1{margin:0 0 16px;font-size:21px}.setting-grid{display:grid;grid-template-columns:1.4fr .8fr .7fr 1.4fr;gap:12px}.field label,.week-label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 5px}input[type="text"],input[type="date"],select,textarea{font:inherit;color:inherit;border:1px solid #cbd6dd;border-radius:9px;background:#fff;width:100%;padding:10px 11px}input[type="text"]:focus,input[type="date"]:focus,select:focus,textarea:focus{outline:3px solid #d9edf6;border-color:var(--blue)}
    .week-row{display:flex;align-items:end;gap:16px;margin-top:15px;flex-wrap:wrap}.weekday-list{display:flex;gap:7px;flex-wrap:wrap}.weekday-list label{margin:0;cursor:pointer}.weekday-list input{position:absolute;opacity:0}.weekday-list span{display:inline-flex;align-items:center;justify-content:center;min-width:48px;padding:9px 10px;border:1px solid #cbd6dd;border-radius:9px;background:#fff;font-weight:700}.weekday-list input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}.helper{font-size:13px;color:var(--muted);margin:11px 0 0}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{font:inherit;font-weight:700;border:1px solid #b8cad5;border-radius:9px;padding:10px 13px;background:#fff;color:#345366;cursor:pointer;touch-action:manipulation}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:#9b3a3a;border-color:#e2bcbc}.btn:hover{filter:brightness(.97)}#importInput{display:none}
    .document{width:210mm;min-height:297mm;margin:24px auto 0;background:var(--paper);padding:14mm 13mm 16mm;box-shadow:0 2px 16px #24313a18}.print-header{border-bottom:2px solid var(--ink);padding-bottom:9px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}.print-header h2{font-size:22px;margin:0;letter-spacing:-.5px}.identity{font-size:14px;color:#465762;white-space:nowrap}.identity b{color:var(--ink)}.records{display:grid;gap:10px}.empty{padding:44px 16px;text-align:center;color:#71818b;background:#f8fafb;border:1px dashed #cbd6dd;border-radius:10px}
    .record{border:1px solid #cbd6dd;border-radius:10px;padding:12px;break-inside:avoid-page;page-break-inside:avoid;overflow:hidden}.record-date{font-size:16px;font-weight:800;margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid #e2e8ec}.record-body{display:grid;grid-template-columns:42% 1fr;gap:14px;align-items:start}.photo-zone{min-height:114px}.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.photo-item{position:relative;min-width:0}.photo-item img{width:100%;height:auto;display:block}.remove-photo{position:absolute;right:4px;top:4px;width:28px;height:28px;border:none;border-radius:50%;color:#fff;background:#24303bd9;font-size:18px;line-height:1;cursor:pointer}.add-photo{width:100%;min-height:114px;border:1.5px dashed #aebfc9;border-radius:7px;background:#f9fbfc;color:#426375;font:inherit;font-weight:700;cursor:pointer}.record-note{min-width:0}.record-note textarea{min-height:138px;resize:vertical;line-height:1.65}.note-output{display:none;font-size:14px;white-space:pre-wrap;word-break:keep-all;min-height:114px;padding:2px}
    @media(max-width:760px){.app{padding:12px 10px 40px}.editor{padding:16px;border-radius:12px}.setting-grid{grid-template-columns:1fr}.document{width:100%;min-height:0;margin-top:14px;padding:18px 14px;box-shadow:none}.print-header{display:block}.identity{margin-top:3px}.record-body{grid-template-columns:39% 1fr;gap:10px}.record{padding:10px}.record-note textarea{min-height:128px}.photo-zone,.add-photo{min-height:102px}}
    @page{size:A4 portrait;margin:0}@media print{body{background:#fff}.app{max-width:none;padding:0}.editor{display:none}.document{width:210mm;min-height:297mm;margin:0;box-shadow:none;padding:14mm 13mm 16mm}.records{display:block}.record{display:block;overflow:visible;margin:0;break-inside:avoid;break-inside:avoid-page;page-break-inside:avoid;break-after:page;page-break-after:always;-webkit-column-break-inside:avoid;-webkit-region-break-inside:avoid}.record:last-child{break-after:auto;page-break-after:auto}.edit-only{display:none!important}.note-output{display:block}.photo-grid{display:flex;flex-wrap:wrap;gap:6px}.photo-item{flex:0 0 calc(50% - 3px);width:calc(50% - 3px)}.photo-item img{width:100%;height:auto;display:block}.print-header{margin-bottom:12px}}
  </style>
</head>
<body>
  <main class="app">
    <section class="editor edit-only" aria-label="기록 설정">
      <h1>보호자 상담기록</h1>
      <div class="setting-grid">
        <div class="field"><label for="childName">아동 이름</label><input id="childName" type="text" placeholder="예: 오유찬"></div>
        <div class="field"><label for="recordYear">연도</label><select id="recordYear"></select></div>
        <div class="field"><label for="recordMonth">월</label><select id="recordMonth"></select></div>
        <div class="field"><label for="recordTitle">타이틀 글자</label><input id="recordTitle" type="text" value="수업내용" placeholder="예: 수업내용"></div>
      </div>
      <div class="week-row">
        <div><span class="week-label">기본 수업 요일 <small>(최대 5개)</small></span><div class="weekday-list" id="weekdayList"></div></div>
      </div>
      <p class="helper">기본 수업 요일을 선택하면 해당 연·월의 날짜가 주차별로 자동 생성됨. 자동 생성 후 각 회기의 날짜는 보강 등에 맞게 직접 수정할 수 있음.</p>
      <div class="week-row"><div><span class="week-label">보호자에게 인쇄할 주차</span><div class="weekday-list" id="weekList"></div></div></div>
      <p class="helper">선택한 주차의 기록만 아래와 인쇄물에 보임. 선택을 해제해도 작성한 내용은 삭제되지 않음.</p>
      <div class="actions"><button class="btn primary" id="printBtn" type="button">PDF 저장 / 인쇄</button><button class="btn" id="backupBtn" type="button">백업 저장</button><button class="btn" id="importBtn" type="button">백업 불러오기</button><input id="importInput" type="file" accept="application/json,.json"><button class="btn danger" id="clearBtn" type="button">새 기록 시작</button></div>
    </section>
    <section class="document" aria-label="인쇄 미리보기">
      <header class="print-header"><h2 id="titleOutput">상담기록</h2><div class="identity"><b id="childOutput">아동 이름</b><span id="monthOutput"></span></div></header>
      <div id="records" class="records"><div class="empty">위에서 해당 주와 수업 요일을 선택해 주세요.</div></div>
    </section>
  </main>
  <script>
  (()=>{
    const DAYS=['월','화','수','목','금','토','일']; const state={days:[],includedWeeks:{}};
    const $=id=>document.getElementById(id); const inputs=['childName','recordYear','recordMonth','recordTitle'];
    const weekdayList=$('weekdayList'), weekList=$('weekList'), records=$('records');
    const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
    const dateText=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[(d.getDay()+6)%7]})`};
    const selectedIndices=()=>[...weekdayList.querySelectorAll('input:checked')].map(x=>Number(x.value));
    const key=(week,weekday)=>`${week}-${weekday}`;
    function buildSelectors(){const now=new Date();for(let y=now.getFullYear()-2;y<=now.getFullYear()+5;y++)$('recordYear').add(new Option(`${y}년`,y,y===now.getFullYear(),y===now.getFullYear()));for(let m=1;m<=12;m++)$('recordMonth').add(new Option(`${m}월`,m,m===now.getMonth()+1,m===now.getMonth()+1));DAYS.forEach((day,i)=>{const label=document.createElement('label');label.innerHTML=`<input type="checkbox" value="${i}"><span>${day}요일</span>`;label.querySelector('input').addEventListener('change',syncRecords);weekdayList.append(label)});for(let w=1;w<=5;w++){const label=document.createElement('label');label.innerHTML=`<input type="checkbox" value="${w}"><span>${w}주</span>`;label.querySelector('input').addEventListener('change',()=>{state.includedWeeks[w]=label.querySelector('input').checked;render();saveDraft()});weekList.append(label)}}
    function generatedDates(weekday){const y=Number($('recordYear').value),m=Number($('recordMonth').value)-1,results=[];for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const x=new Date(y,m,d);if((x.getDay()+6)%7===weekday)results.push(iso(x))}return results}
    function syncRecords(){const checks=selectedIndices();if(checks.length>5){const last=[...weekdayList.querySelectorAll('input:checked')].pop();last.checked=false;alert('수업 요일은 최대 5개까지 선택할 수 있어요.');return}const previous=new Map(state.days.map(x=>[key(x.week,x.weekday),x]));state.days=[];checks.forEach(weekday=>generatedDates(weekday).forEach((date,i)=>{const week=i+1;state.days.push(previous.get(key(week,weekday))||{week,weekday,date,note:'',photos:[]});if(!(week in state.includedWeeks))state.includedWeeks[week]=true}));updateWeekChecks();render();saveDraft()}
    function updateWeekChecks(){weekList.querySelectorAll('input').forEach(x=>x.checked=!!state.includedWeeks[Number(x.value)])}
    function visibleDays(){return state.days.filter(x=>state.includedWeeks[x.week]).sort((a,b)=>a.date.localeCompare(b.date))}
    function render(){const child=$('childName').value.trim()||'아동 이름',title=$('recordTitle').value.trim()||'수업내용';$('childOutput').textContent=child;$('titleOutput').textContent=title;$('monthOutput').textContent=` · ${$('recordYear').value}년 ${$('recordMonth').value}월`;const days=visibleDays();if(!days.length){records.innerHTML='<div class="empty">인쇄할 주차를 선택해 주세요.</div>';return}records.innerHTML='';days.forEach(item=>{const recordIndex=state.days.indexOf(item),card=document.createElement('article');card.className='record';card.dataset.index=recordIndex;const photos=item.photos.length?`<div class="photo-grid">${item.photos.map((src,p)=>`<div class="photo-item"><img src="${src}" alt="수업 사진 ${p+1}"><button class="remove-photo edit-only" type="button" data-remove="${p}" aria-label="사진 삭제">×</button></div>`).join('')}</div>`:'';card.innerHTML=`<div class="record-date"><span class="date-label">${dateText(item.date)}</span> <button class="btn edit-only" type="button" data-date-change style="padding:3px 7px;font-size:12px;float:right">날짜 변경</button></div><div class="record-body"><div class="photo-zone">${photos}<button class="add-photo edit-only" type="button" data-add-photo ${item.photos.length?'style="margin-top:7px;min-height:42px"':''}>사진 추가</button></div><div class="record-note"><textarea class="edit-only" placeholder="그날의 수업 내용과 보호자 상담 내용을 간단히 입력하세요.">${escapeHtml(item.note)}</textarea><div class="note-output">${escapeHtml(item.note)||'<span style="color:#9aa8b1">상담 내용을 입력하세요.</span>'}</div></div></div>`;records.append(card)})}
    const escapeHtml=s=>(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    records.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA'){const i=Number(e.target.closest('.record').dataset.index);state.days[i].note=e.target.value;const output=e.target.nextElementSibling;output.textContent=e.target.value;if(!e.target.value)output.innerHTML='<span style="color:#9aa8b1">상담 내용을 입력하세요.</span>';saveDraft()}});
    records.addEventListener('click',e=>{const card=e.target.closest('.record');if(!card)return;const i=Number(card.dataset.index);if(e.target.hasAttribute('data-add-photo')){const f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=true;f.onchange=async()=>{for(const file of [...f.files]){if(file.size>8*1024*1024){alert(`${file.name}은 8MB보다 커서 제외했어요.`);continue}state.days[i].photos.push(await readFile(file))}render();saveDraft()};f.click()}if(e.target.dataset.remove!==undefined){state.days[i].photos.splice(Number(e.target.dataset.remove),1);render();saveDraft()}if(e.target.hasAttribute('data-date-change')){const next=prompt('날짜를 YYYY-MM-DD 형식으로 입력하세요.',state.days[i].date);if(next&&/^\d{4}-\d{2}-\d{2}$/.test(next)){state.days[i].date=next;render();saveDraft()}else if(next)alert('날짜 형식을 확인해 주세요.')}});
    const readFile=file=>new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
    function saveDraft(){try{localStorage.setItem('parentConsultationDraft',JSON.stringify({settings:Object.fromEntries(inputs.map(k=>[k,$(k).value])),checked:selectedIndices(),includedWeeks:state.includedWeeks,days:state.days}))}catch(e){console.warn(e)}}
    function loadDraft(){try{const d=JSON.parse(localStorage.getItem('parentConsultationDraft'));if(!d)return;inputs.forEach(k=>$(k).value=d.settings?.[k]||$(k).value);d.checked?.forEach(i=>{const x=weekdayList.querySelector(`input[value="${i}"]`);if(x)x.checked=true});state.includedWeeks=d.includedWeeks||{};state.days=Array.isArray(d.days)?d.days:[];updateWeekChecks();render()}catch(e){console.warn(e)}}
    inputs.forEach(k=>$(k).addEventListener('input',()=>{if(k==='recordYear'||k==='recordMonth')syncRecords();else{render();saveDraft()}}));
    $('backupBtn').onclick=()=>{const data={version:2,savedAt:new Date().toISOString(),settings:Object.fromEntries(inputs.map(k=>[k,$(k).value])),checked:selectedIndices(),includedWeeks:state.includedWeeks,days:state.days};const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${$('childName').value.trim()||'상담기록'}_${$('recordYear').value}-${$('recordMonth').value}.json`;a.click();URL.revokeObjectURL(a.href)};
    $('importBtn').onclick=()=>$('importInput').click();$('importInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d.settings||!Array.isArray(d.days))throw Error();inputs.forEach(k=>$(k).value=d.settings[k]||$(k).value);weekdayList.querySelectorAll('input').forEach(x=>x.checked=(d.checked||[]).includes(Number(x.value)));state.includedWeeks=d.includedWeeks||{};state.days=d.days.map(x=>({week:Number(x.week)||1,weekday:Number(x.weekday)||0,date:x.date,note:x.note||'',photos:Array.isArray(x.photos)?x.photos:[]}));updateWeekChecks();render();saveDraft();alert('백업을 불러왔어요.')}catch{alert('읽을 수 없는 백업 파일이에요.')}e.target.value=''};
    $('clearBtn').onclick=()=>{if(confirm('현재 작성한 내용을 지우고 새 기록을 시작할까요?')){localStorage.removeItem('parentConsultationDraft');state.days=[];state.includedWeeks={};$('childName').value='';$('recordTitle').value='수업내용';weekdayList.querySelectorAll('input').forEach(x=>x.checked=false);updateWeekChecks();render()}};
    $('printBtn').onclick=()=>window.print();buildSelectors();loadDraft();render();
  })();
  </script>
</body>
</html>
