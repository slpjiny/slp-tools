<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일기 쓰기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700&display=swap');
:root{--font:'Nanum Gothic',sans-serif;--fs:21px;--lh:44px;--ink:#30343b;--line:#b9c9d8;--mint:#eaf7f2;--peach:#fff1e8;--lav:#f2effb;--yellow:#fff9dc}
*{box-sizing:border-box} body{margin:0;background:#f5f6f8;color:var(--ink);font-family:'Nanum Gothic',sans-serif}.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.toolbar button,.toolbar select{font:inherit;border:1px solid #ccd2d8;background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.toolbar button:hover{background:#f5f7f8}.toolbar .danger{color:#a33}.toolbar label{font-size:13px;display:flex;gap:5px;align-items:center}.hint{width:100%;text-align:center;font-size:12px;color:#777;margin-top:-2px}.pages{padding:18px 0 50px}.diary-page{width:210mm;height:297mm;margin:0 auto 20px;background:#fff;padding:15mm 14mm 14mm;box-shadow:0 2px 12px #0002;position:relative;overflow:hidden}.top-accent{height:7px;border-radius:10px;background:linear-gradient(90deg,var(--mint) 0 25%,var(--peach) 25% 50%,var(--lav) 50% 75%,var(--yellow) 75%);margin-bottom:9mm}.meta{display:grid;grid-template-columns:1.15fr .85fr;gap:8mm;align-items:end;border-bottom:1.5px solid #aebac4;padding:0 2mm 4mm}.date-row{display:flex;align-items:center;gap:4px;white-space:nowrap}.date-row input{width:48px;border:0;border-bottom:1px solid #b8bec4;text-align:center;font:inherit;background:transparent;outline:none;padding:2px}.date-row input.year{width:68px}.date-row input.weekday{width:48px}.weather{display:flex;align-items:center;justify-content:flex-end;gap:5px}.weather-title{font-weight:700;margin-right:3px}.weather img{width:32px;height:32px;object-fit:contain}.title-row{margin-top:7mm;display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px}.title-label{font-weight:700;text-align:center;background:var(--peach);border-radius:8px;padding:7px 3px}.title-input{width:100%;border:0;border-bottom:1.5px solid #aebac4;outline:none;padding:5px 6px;font-family:var(--font);font-size:calc(var(--fs) + 2px);background:transparent}.writing-wrap{margin-top:8mm;height:196mm;position:relative;overflow:hidden}.writing-lines{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--line) calc(var(--lh) - 1px),var(--line) var(--lh));pointer-events:none}.writing{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;padding:0 5px;margin:0;color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:var(--lh);overflow:hidden}.page-tools{position:absolute;right:8mm;bottom:6mm;display:flex;gap:5px}.page-tools button{border:1px solid #d5d9dd;background:#fff;border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer}.page-no{position:absolute;left:0;right:0;bottom:5mm;text-align:center;font-size:11px;color:#aaa;pointer-events:none}.print-only{display:none}
@media(max-width:850px){.diary-page{transform-origin:top center;width:96vw;height:135.8vw;padding:6.8vw 6.4vw}.pages{overflow:hidden}.writing-wrap{height:89vw}.meta{gap:3vw}.weather img{width:27px;height:27px}}
@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.toolbar{display:none!important}.pages{padding:0}.diary-page{width:210mm;height:297mm;margin:0;box-shadow:none;page-break-after:always;break-after:page}.diary-page:last-child{page-break-after:auto}.page-tools,.page-no{display:none!important}.writing-lines{background:none!important}.writing-lines.has-text{display:none!important}.writing-lines.is-empty{display:block!important}.print-rule{height:var(--lh);border-bottom:1px solid #9eacb8!important}}
</style>
</head>
<body>
<div class="toolbar">
  <button id="addBtn">＋ 페이지 추가</button>
  <button id="printBtn">전체 인쇄</button>
  <button id="printCurrentBtn">이 페이지만 인쇄</button>
  <label>글꼴 <select id="fontSel"><option value="'Nanum Gothic',sans-serif">나눔고딕</option><option value="'Gowun Dodum',sans-serif">손글씨</option><option value="Dotum,'돋움',sans-serif">돋움</option></select></label>
  <label>글자 <select id="sizeSel"><option value="18">작게</option><option value="21" selected>보통</option><option value="24">크게</option><option value="28">아주 크게</option></select></label>
  <label>줄 간격 <select id="lineSel"><option value="38">좁게</option><option value="44" selected>보통</option><option value="52">넓게</option><option value="60">아주 넓게</option></select></label>
  <button id="saveBtn">백업 저장</button><button id="loadBtn">백업 불러오기</button><input id="fileInput" type="file" accept="application/json" hidden>
  <button id="resetBtn" class="danger">전체 초기화</button>
  <div class="hint">날짜를 입력하면 요일이 자동으로 표시됩니다. 날씨 그림은 인쇄 후 직접 표시하세요.</div>
</div>
<div class="pages" id="pages"></div>
<script>
const weatherSvgs = [
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="#ffd86b" stroke="#d6a83d" stroke-width="3"/><g stroke="#d6a83d" stroke-width="3" stroke-linecap="round"><path d="M32 5v9M32 50v9M5 32h9M50 32h9M13 13l7 7M44 44l7 7M51 13l-7 7M20 44l-7 7"/></g></svg>`,
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="24" cy="24" r="12" fill="#ffd86b" stroke="#d6a83d" stroke-width="3"/><g stroke="#d6a83d" stroke-width="2.5" stroke-linecap="round"><path d="M24 5v6M8 24h6M12 12l5 5M36 12l-5 5"/></g><path d="M19 48h31a9 9 0 0 0 0-18 14 14 0 0 0-26 5 7 7 0 0 0-5 13z" fill="#f5f7f8" stroke="#9aa9b4" stroke-width="3"/></svg>`,
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M12 46h40a10 10 0 0 0 0-20 16 16 0 0 0-30-5 12 12 0 0 0-10 25z" fill="#8d99a6" stroke="#596572" stroke-width="3"/><path d="M18 19c4-8 14-11 22-7" fill="none" stroke="#b8c0c8" stroke-width="3" stroke-linecap="round"/></svg>`,
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M12 36h40a10 10 0 0 0 0-20 16 16 0 0 0-30-5 12 12 0 0 0-10 25z" fill="#b8c3cc" stroke="#687683" stroke-width="3"/><g stroke="#5aa9d6" stroke-width="4" stroke-linecap="round"><path d="M20 44l-3 8M33 44l-3 8M46 44l-3 8"/></g></svg>`,
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M12 34h40a10 10 0 0 0 0-20 16 16 0 0 0-30-5 12 12 0 0 0-10 25z" fill="#eef4f7" stroke="#8799a5" stroke-width="3"/><g fill="#8ec5df"><circle cx="20" cy="46" r="3"/><circle cx="32" cy="52" r="3"/><circle cx="45" cy="45" r="3"/><path d="M20 39v14M13 46h14M15 41l10 10M25 41L15 51" stroke="#8ec5df" stroke-width="2"/></g></svg>`];
const imgSrc=s=>'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(s);
let currentPage=null;
function pageHTML(data={}){const w=weatherSvgs.map(s=>`<img alt="날씨" src="${imgSrc(s)}">`).join('');return `<div class="top-accent"></div><div class="meta"><div class="date-row"><strong>날짜</strong><input class="year" inputmode="numeric" maxlength="4" value="${data.year||''}">년 <input class="month" inputmode="numeric" maxlength="2" value="${data.month||''}">월 <input class="day" inputmode="numeric" maxlength="2" value="${data.day||''}">일 <input class="weekday" value="${data.weekday||''}">요일</div><div class="weather"><span class="weather-title">날씨</span>${w}</div></div><div class="title-row"><div class="title-label">제목</div><input class="title-input" value="${esc(data.title||'')}"></div><div class="writing-wrap"><div class="writing-lines"></div><textarea class="writing">${esc(data.body||'')}</textarea></div><div class="page-tools"><button class="duplicate">복제</button><button class="delete">삭제</button></div><div class="page-no"></div>`}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function preparePrintLines(){document.querySelectorAll('.diary-page').forEach(p=>{const lines=p.querySelector('.writing-lines'),body=p.querySelector('.writing');const empty=!body.value.trim();lines.classList.toggle('is-empty',empty);lines.classList.toggle('has-text',!empty);lines.innerHTML='';if(empty){const wrap=p.querySelector('.writing-wrap');const lh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lh'))||38;const count=Math.floor(wrap.getBoundingClientRect().height/lh);for(let i=0;i<count;i++){const r=document.createElement('div');r.className='print-rule';lines.appendChild(r)}}})}
function cleanupPrintLines(){document.querySelectorAll('.writing-lines').forEach(lines=>{lines.classList.remove('is-empty','has-text');lines.innerHTML=''})}
window.addEventListener('beforeprint',preparePrintLines);window.addEventListener('afterprint',cleanupPrintLines);
function addPage(data={},after=null){const p=document.createElement('section');p.className='diary-page';p.innerHTML=pageHTML(data);if(after)after.after(p);else pages.appendChild(p);wire(p);renumber();currentPage=p;return p}
function wire(p){p.addEventListener('pointerdown',()=>currentPage=p);const y=p.querySelector('.year'),m=p.querySelector('.month'),d=p.querySelector('.day'),wd=p.querySelector('.weekday');[y,m,d].forEach(i=>i.addEventListener('input',()=>{const yy=+y.value,mm=+m.value,dd=+d.value;if(yy>0&&mm>=1&&mm<=12&&dd>=1&&dd<=31){const dt=new Date(yy,mm-1,dd);if(dt.getFullYear()===yy&&dt.getMonth()===mm-1&&dt.getDate()===dd)wd.value='일월화수목금토'[dt.getDay()];}}));p.querySelector('.duplicate').onclick=()=>addPage(readPage(p),p);p.querySelector('.delete').onclick=()=>{if(document.querySelectorAll('.diary-page').length===1){if(confirm('마지막 페이지의 내용을 비울까요?'))clearPage(p);return}if(confirm('이 페이지를 삭제할까요?')){p.remove();renumber();currentPage=document.querySelector('.diary-page')}}}
function readPage(p){return{year:p.querySelector('.year').value,month:p.querySelector('.month').value,day:p.querySelector('.day').value,weekday:p.querySelector('.weekday').value,title:p.querySelector('.title-input').value,body:p.querySelector('.writing').value}}
function clearPage(p){['.year','.month','.day','.weekday','.title-input','.writing'].forEach(q=>p.querySelector(q).value='')}
function renumber(){[...document.querySelectorAll('.diary-page')].forEach((p,i)=>p.querySelector('.page-no').textContent=`${i+1} / ${document.querySelectorAll('.diary-page').length}`)}
function settings(){return{font:fontSel.value,size:sizeSel.value,line:lineSel.value}}
function applySettings(){document.documentElement.style.setProperty('--font',fontSel.value);document.documentElement.style.setProperty('--fs',sizeSel.value+'px');document.documentElement.style.setProperty('--lh',lineSel.value+'px');localStorage.setItem('diary-settings',JSON.stringify(settings()))}
addBtn.onclick=()=>addPage();printBtn.onclick=()=>window.print();printCurrentBtn.onclick=()=>{if(!currentPage)currentPage=document.querySelector('.diary-page');document.body.classList.add('single-print');[...document.querySelectorAll('.diary-page')].forEach(p=>p.style.display=p===currentPage?'block':'none');window.print();setTimeout(()=>{document.querySelectorAll('.diary-page').forEach(p=>p.style.display='');document.body.classList.remove('single-print')},300)};
[fontSel,sizeSel,lineSel].forEach(x=>x.onchange=applySettings);
saveBtn.onclick=()=>{const data={version:1,settings:settings(),pages:[...document.querySelectorAll('.diary-page')].map(readPage)};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='일기쓰기_백업.json';a.click();URL.revokeObjectURL(a.href)};
loadBtn.onclick=()=>fileInput.click();fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.pages))throw 0;pages.innerHTML='';if(data.settings){fontSel.value=data.settings.font||fontSel.value;sizeSel.value=data.settings.size||sizeSel.value;lineSel.value=data.settings.line||lineSel.value;applySettings()}data.pages.forEach(x=>addPage(x));if(!data.pages.length)addPage()}catch(e){alert('올바른 백업 파일이 아니에요.')}fileInput.value=''};
resetBtn.onclick=()=>{if(confirm('모든 페이지와 작성 내용을 지우고 빈 1페이지로 초기화할까요?')){pages.innerHTML='';addPage()}};
const saved=JSON.parse(localStorage.getItem('diary-settings')||'null');if(saved){const fontValues=[...fontSel.options].map(o=>o.value),sizeValues=[...sizeSel.options].map(o=>o.value),lineValues=[...lineSel.options].map(o=>o.value);if(fontValues.includes(saved.font))fontSel.value=saved.font;if(sizeValues.includes(saved.size))sizeSel.value=saved.size;if(lineValues.includes(saved.line))lineSel.value=saved.line}applySettings();addPage();
</script>
</body>
</html>
