<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한글 음절 상자 게임</title>
<style>
:root {
  --bg:#f6f7fb;
  --panel:#fff;
  --line:#e1e5eb;
  --ink:#222;
  --muted:#707783;
  --accent:#5967d8;
  --red:#ff0000;
  --blue:#0070c0;
  --box-w:160px;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body {
  font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
button,input,select { font:inherit; }
button { cursor:pointer; }

.hidden { display:none !important; }

.app {
  min-height:100vh;
}
.setup {
  max-width:1180px;
  margin:0 auto;
  padding:22px;
}
.title {
  margin:0 0 16px;
  font-size:28px;
}
.panel {
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  margin-bottom:14px;
}
.grid2 {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.setting label.main {
  display:block;
  font-weight:700;
  margin-bottom:8px;
}
.radios {
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
.radios label {
  display:flex;
  align-items:center;
  gap:5px;
}
.problem-form {
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  gap:14px;
  align-items:center;
}
.image-drop {
  position:relative;
  aspect-ratio:1/1;
  border:2px dashed #c8ced8;
  border-radius:12px;
  background:#fafbfc;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#818894;
  cursor:pointer;
}
.image-drop.drag {
  background:#f0f2ff;
  border-color:#929ced;
}
.image-drop img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.problem-form input[type="text"] {
  width:100%;
  height:46px;
  border:1px solid #ccd2db;
  border-radius:10px;
  padding:0 12px;
  font-size:18px;
}
.btnrow {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}
.btn {
  border:0;
  border-radius:9px;
  padding:10px 14px;
  background:#eceff4;
  font-weight:700;
}
.btn.primary {
  background:var(--accent);
  color:#fff;
}
.btn.danger {
  background:#fff0f0;
  color:#b23333;
}
.problem-list {
  display:flex;
  flex-direction:column;
  gap:8px;
}
.problem-item {
  display:grid;
  grid-template-columns:56px 1fr auto;
  gap:10px;
  align-items:center;
  border:1px solid #e1e5eb;
  border-radius:10px;
  padding:8px;
}
.problem-thumb {
  width:56px;
  height:56px;
  border-radius:8px;
  background:#f5f6f8;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#a0a6af;
  font-size:11px;
}
.problem-thumb img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.problem-word {
  font-size:18px;
  font-weight:700;
}
.muted {
  color:var(--muted);
  font-size:13px;
}
.startbar {
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.game {
  min-height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  background:#fff;
}
.game-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 22px;
  border-bottom:1px solid var(--line);
  background:#fff;
}
.game-title {
  font-size:22px;
  font-weight:800;
}
.progress {
  font-size:18px;
  font-weight:800;
}
.game-body {
  display:grid;
  grid-template-columns:minmax(0,1fr) 410px;
  min-height:0;
}
.problem-area {
  min-width:0;
  padding:24px 26px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:16px;
  overflow:auto;
}
.problem-image {
  width:min(42vh,360px);
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
}
.problem-image img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.answer-word {
  font-size:36px;
  font-weight:800;
  text-align:center;
  min-height:44px;
}
.order-hint {
  text-align:center;
  font-size:20px;
  font-weight:700;
  color:#555e6c;
  min-height:30px;
  line-height:1.55;
  max-width:900px;
}
.boxes {
  display:flex;
  justify-content:center;
  align-items:flex-start;
  flex-wrap:nowrap;
  gap:10px;
  width:100%;
  overflow:visible;
}
.syllable {
  position:relative;
  width:var(--box-w);
  aspect-ratio:900/1300;
  flex:0 0 auto;
}
.syllable img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  pointer-events:none;
  user-select:none;
}
.slot-hit {
  position:absolute;
  z-index:20;
  border-radius:8px;
}
.slot-hit.practice-filled {
  cursor:pointer;
}
.slot-hit.wrong {
  background:rgba(230,52,52,.24);
  border:3px solid #e33434;
  cursor:pointer;
}
.slot-hit.current {
  outline:4px solid rgba(255,194,54,.85);
  outline-offset:-3px;
}
.slot-hit.onset { left:3.8%; top:8%; width:49%; height:37%; }
.slot-hit.vowelBottom { left:3.8%; top:43%; width:49%; height:14%; }
.slot-hit.vowelRight { left:56%; top:8%; width:40%; height:47%; }
.slot-hit.final1 { left:3.8%; top:57%; width:43%; height:34%; }
.slot-hit.final2 { left:53.3%; top:57%; width:43%; height:34%; }
.wrong-text {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:clamp(24px,4vw,58px);
  color:#c92d2d;
}
.feedback {
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  font-weight:900;
}
.feedback.ok { color:#2e9c4b; }
.feedback.no { color:#dc3434; }

.jamo-panel {
  border-left:1px solid var(--line);
  padding:20px;
  overflow:auto;
  background:#fafbfc;
}
.jamo-section + .jamo-section {
  margin-top:24px;
}
.jamo-heading {
  margin:0 0 10px;
  font-size:18px;
}
.jamo-grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.jamo-btn {
  height:62px;
  border:1px solid #d7dce4;
  border-radius:11px;
  background:#fff;
  font-size:32px;
  font-weight:900;
}
.jamo-btn.cons {
  color:var(--red);
}
.jamo-btn.vowel {
  color:var(--blue);
}
.jamo-btn:active {
  transform:translateY(1px);
  background:#f0f2f6;
}
.game-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px 20px;
  border-top:1px solid var(--line);
  background:#fff;
}
.footer-left,.footer-right {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.next-btn[disabled] {
  opacity:.4;
  cursor:not-allowed;
}

.end-screen {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.end-card {
  width:min(520px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:30px;
  text-align:center;
}
.end-card h2 {
  font-size:30px;
  margin:0 0 10px;
}

.print-root {
  display:none;
}

@media (max-width:1050px) {
  .game-body {
    grid-template-columns:1fr;
  }
  .jamo-panel {
    border-left:0;
    border-top:1px solid var(--line);
  }
  .game-header {
    position:sticky;
    top:0;
    z-index:50;
  }
}
@media (max-width:720px) {
  .setup { padding:12px; }
  .grid2 { grid-template-columns:1fr; }
  .problem-form { grid-template-columns:1fr; }
  .image-drop { width:min(260px,100%); }
  .game-body { display:block; }
  .problem-area { padding:16px 10px; }
  .jamo-panel { padding:14px 10px; }
  .jamo-btn { height:54px; font-size:28px; }
}

@media print {
  @page { size:A4 landscape; margin:0; }
  body > .app { display:none !important; }
  .print-root {
    display:block !important;
  }
  .print-page {
    width:297mm;
    height:210mm;
    page-break-after:always;
    break-after:page;
    overflow:hidden;
    background:#fff;
    display:grid;
    grid-template-rows:16mm 1fr;
  }
  .print-page:last-child {
    page-break-after:auto;
    break-after:auto;
  }
  .print-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 11mm;
    border-bottom:.3mm solid #ddd;
    font-size:5mm;
    font-weight:800;
  }
  .print-body {
    display:grid;
    grid-template-columns:1fr 92mm;
    min-height:0;
  }
  .print-problem {
    padding:8mm 8mm 6mm;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4mm;
  }
  .print-image {
    width:68mm;
    height:68mm;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .print-image img {
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }
  .print-answer {
    min-height:9mm;
    font-size:8mm;
    font-weight:800;
    text-align:center;
  }
  .print-order {
    min-height:7mm;
    font-size:5mm;
    font-weight:700;
    color:#555;
    text-align:center;
  }
  .print-boxes {
    display:flex;
    justify-content:center;
    gap:2mm;
    width:100%;
  }
  .print-boxes .syllable {
  }
  .print-jamo {
    border-left:.3mm solid #ddd;
    padding:6mm;
  }
  .print-jamo h3 {
    margin:0 0 3mm;
    font-size:5mm;
  }
  .print-jamo .jamo-grid {
    gap:2mm;
  }
  .print-jamo .jamo-btn {
    height:13mm;
    font-size:7mm;
    border:.3mm solid #ddd;
    border-radius:2mm;
  }
}
</style>
</head>
<body>
<div class="app">
  <section id="setupView" class="setup">
    <h1 class="title">한글 음절 상자 게임</h1>

    <div class="panel">
      <div class="grid2">
        <div class="setting">
          <label class="main">게임 모드</label>
          <div class="radios">
            <label><input type="radio" name="gameMode" value="practice" checked> 단어 연습</label>
            <label><input type="radio" name="gameMode" value="quiz"> 단어 퀴즈</label>
          </div>
        </div>

        <div class="setting">
          <label class="main">문제 순서</label>
          <div class="radios">
            <label><input type="radio" name="orderMode" value="normal" checked> 등록 순서</label>
            <label><input type="radio" name="orderMode" value="random"> 랜덤</label>
          </div>
        </div>

        <div class="setting">
          <label class="main">그림 보기</label>
          <div class="radios">
            <label><input type="radio" name="showImage" value="on" checked> ON</label>
            <label><input type="radio" name="showImage" value="off"> OFF</label>
          </div>
        </div>

        <div class="setting">
          <label class="main">정답 글자 보기</label>
          <div class="radios">
            <label><input type="radio" name="showWord" value="on"> ON</label>
            <label><input type="radio" name="showWord" value="off" checked> OFF</label>
          </div>
          <div style="margin-top:10px">
            <label class="main" style="font-size:13px">정답 글자 크기</label>
            <input id="answerSize" type="range" min="24" max="64" step="2" value="36" style="width:100%">
            <div class="muted"><span id="answerSizeLabel">36</span>px</div>
          </div>
        </div>

        <div class="setting">
          <label class="main">음절상자 크기</label>
          <input id="boxSize" type="range" min="70" max="140" step="5" value="100" style="width:100%">
          <div class="muted"><span id="boxSizeLabel">100</span>%</div>
        </div>

        <div class="setting">
          <label class="main">입력 순서 보기</label>
          <div class="radios">
            <label><input type="radio" name="showOrder" value="on"> ON</label>
            <label><input type="radio" name="showOrder" value="off" checked> OFF</label>
          </div>
          <div style="margin-top:10px">
            <label class="main" style="font-size:13px">순서 힌트 형식</label>
            <div class="radios">
              <label><input type="radio" name="orderStyle" value="numbered" checked> 숫자 + 글자 + 화살표</label>
              <label><input type="radio" name="orderStyle" value="arrow"> 글자 + 화살표</label>
            </div>
          </div>
          <div style="margin-top:10px">
            <label class="main" style="font-size:13px">순서 힌트 크기</label>
            <input id="orderSize" type="range" min="14" max="36" step="1" value="20" style="width:100%">
            <div class="muted"><span id="orderSizeLabel">20</span>px</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">문제 추가</h2>
      <div class="problem-form">
        <div id="imageDrop" class="image-drop">
          <span id="imagePlaceholder">그림 선택 사항<br><small>클릭 · 드래그 · 붙여넣기</small></span>
          <img id="imagePreview" class="hidden" alt="">
        </div>
        <div>
          <input id="wordInput" type="text" placeholder="정답 단어 입력 (예: 사과)">
          <div class="btnrow">
            <button id="addProblemBtn" class="btn primary">문제 추가</button>
            <button id="clearImageBtn" class="btn">그림 지우기</button>
          </div>
          <div class="muted" style="margin-top:8px">정답 단어는 필수, 그림은 선택입니다.</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">등록된 문제</h2>
      <div id="problemList" class="problem-list"></div>
      <div id="emptyProblems" class="muted">아직 등록된 문제가 없습니다.</div>
    </div>

    <div class="startbar">
      <button id="startBtn" class="btn primary">게임 시작</button>
    </div>
  </section>

  <section id="gameView" class="game hidden">
    <header class="game-header">
      <div id="gameModeTitle" class="game-title">단어 연습</div>
      <div id="progress" class="progress">1 / 1</div>
    </header>

    <div class="game-body">
      <main class="problem-area">
        <div id="gameImage" class="problem-image"></div>
        <div id="answerWord" class="answer-word"></div>
        <div id="orderHint" class="order-hint"></div>
        <div id="feedback" class="feedback"></div>
        <div id="boxes" class="boxes"></div>
      </main>

      <aside class="jamo-panel">
        <section class="jamo-section">
          <h3 class="jamo-heading">자음</h3>
          <div id="consonantGrid" class="jamo-grid"></div>
        </section>
        <section class="jamo-section">
          <h3 class="jamo-heading">모음</h3>
          <div id="vowelGrid" class="jamo-grid"></div>
        </section>
      </aside>
    </div>

    <footer class="game-footer">
      <div class="footer-left">
        <button id="backSetupBtn" class="btn">설정으로</button>
        <button id="printCurrentBtn" class="btn">현재 문제 인쇄</button>
        <button id="printAllBtn" class="btn">전체 문제 인쇄</button>
      </div>
      <div class="footer-right">
        <button id="retryBtn" class="btn">다시하기</button>
        <button id="nextBtn" class="btn primary next-btn">다음 문제</button>
      </div>
    </footer>
  </section>

  <section id="endView" class="end-screen hidden">
    <div class="end-card">
      <h2>모두 끝났어요!</h2>
      <p class="muted">등록한 문제를 모두 진행했습니다.</p>
      <div class="btnrow" style="justify-content:center">
        <button id="restartBtn" class="btn primary">다시 하기</button>
        <button id="homeBtn" class="btn">처음으로</button>
      </div>
    </div>
  </section>
</div>

<input id="imagePicker" type="file" accept="image/*" hidden>
<div id="printRoot" class="print-root"></div>

  "ㅝ":["ㅜ","ㅓ"], "ㅞ":["ㅜ","ㅔ"], "ㅟ":["ㅜ","ㅣ"], "ㅢ":["ㅡ","ㅣ"]
};
const DOUBLE_FINAL = {
  "ㄲ":["ㄱ","ㄱ"], "ㅆ":["ㅅ","ㅅ"],
  "ㄳ":["ㄱ","ㅅ"], "ㄵ":["ㄴ","ㅈ"], "ㄶ":["ㄴ","ㅎ"],
  "ㄺ":["ㄹ","ㄱ"], "ㄻ":["ㄹ","ㅁ"], "ㄼ":["ㄹ","ㅂ"],
  "ㄽ":["ㄹ","ㅅ"], "ㄾ":["ㄹ","ㅌ"], "ㄿ":["ㄹ","ㅍ"],
  "ㅀ":["ㄹ","ㅎ"], "ㅄ":["ㅂ","ㅅ"]
};
const HORIZONTAL = new Set(["ㅗ","ㅛ","ㅜ","ㅠ","ㅡ"]);
const CONSONANTS = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ","ㄲ","ㄸ","ㅃ","ㅆ","ㅉ"];
const VOWELS = ["ㅏ","ㅑ","ㅓ","ㅕ","ㅗ","ㅛ","ㅜ","ㅠ","ㅡ","ㅣ","ㅐ","ㅔ","ㅒ","ㅖ"];

let problems = [];
let tempImage = null;
let gameOrder = [];
let currentIndex = 0;
let state = null;
let lastFeedback = "";
let printMode = null;

const setupView = document.getElementById("setupView");
const gameView = document.getElementById("gameView");
const endView = document.getElementById("endView");
const imageDrop = document.getElementById("imageDrop");
const imagePreview = document.getElementById("imagePreview");
const imagePlaceholder = document.getElementById("imagePlaceholder");
const wordInput = document.getElementById("wordInput");
const imagePicker = document.getElementById("imagePicker");
const answerSizeEl = document.getElementById("answerSize");
const orderSizeEl = document.getElementById("orderSize");
const boxSizeEl = document.getElementById("boxSize");

function radio(name) {
  return document.querySelector(`input[name="${name}"]:checked`).value;
}

function isHangul(ch) {
  const c = ch.charCodeAt(0);
  return c >= 0xAC00 && c <= 0xD7A3;
}

function decompose(ch) {
  const n = ch.charCodeAt(0) - 0xAC00;
  const cho = CHO[Math.floor(n / 588)];
  const jung = JUNG[Math.floor((n % 588) / 28)];
  const jong = JONG[n % 28];
  return {
    cho, jung, jong,
    vowelParts: COMPOUND_VOWEL[jung] || [jung],
    finalParts: jong ? (DOUBLE_FINAL[jong] || [jong]) : []
  };
}

function syllablePlan(ch, syllableIndex) {
  const d = decompose(ch);
  const plan = [];
  plan.push({symbol:d.cho, slot:"onset", syllableIndex});
  if (COMPOUND_VOWEL[d.jung]) {
    plan.push({symbol:d.vowelParts[0], slot:"vowelBottom", syllableIndex});
    plan.push({symbol:d.vowelParts[1], slot:"vowelRight", syllableIndex});
  } else if (HORIZONTAL.has(d.jung)) {
    plan.push({symbol:d.jung, slot:"vowelBottom", syllableIndex});
  } else {
    plan.push({symbol:d.jung, slot:"vowelRight", syllableIndex});
  }

  if (d.finalParts.length === 2) {
    plan.push({symbol:d.finalParts[0], slot:"final1", syllableIndex});
    plan.push({symbol:d.finalParts[1], slot:"final2", syllableIndex});
  } else if (d.finalParts.length === 1) {
    const slot = (!COMPOUND_VOWEL[d.jung] && HORIZONTAL.has(d.jung)) ? "final1" : "final2";
    plan.push({symbol:d.finalParts[0], slot, syllableIndex});
  }
  return plan;
}

function buildProblemPlan(word) {
  const syllables = Array.from(word).filter(isHangul);
  const plan = [];
  syllables.forEach((ch,i)=>plan.push(...syllablePlan(ch,i)));
  return {syllables,plan};
}

function layer(src, cls="") {
  const img=document.createElement("img");
  img.src=src;
  img.alt="";
  img.draggable=false;
  if(cls) img.className=cls;
  return img;
}

function overlayFor(slot, symbol) {
  if(slot==="onset" && ASSET.onset[symbol]) return ASSET.onset[symbol];
  if(slot==="final1" && ASSET.final1[symbol]) return ASSET.final1[symbol];
  if(slot==="final2" && ASSET.final2[symbol]) return ASSET.final2[symbol];
  if((slot==="vowelBottom" || slot==="vowelRight") && ASSET.vowel[symbol]) {
    const horizontal = HORIZONTAL.has(symbol);
    if(slot==="vowelBottom" && horizontal) return ASSET.vowel[symbol];
    if(slot==="vowelRight" && !horizontal) return ASSET.vowel[symbol];
  }
  return null;
}

function resetQuizInputPosition() {
  if(!state) return;
  const next = state.entries.findIndex(e => !e.filled);
  state.nextIndex = next < 0 ? state.entries.length : next;
  state.complete = state.nextIndex >= state.entries.length;
}

function addSlotHit(box, entry, idx, mode) {
  const hit=document.createElement("div");
  hit.className=`slot-hit ${entry.slot}`;
  if(entry.isWrong) hit.classList.add("wrong");
  if(entry.filled && mode==="practice") hit.classList.add("practice-filled");
  if(idx === state.nextIndex && !state.wrongEntry) hit.classList.add("current");

  if(entry.isWrong) {
    const t=document.createElement("div");
    t.className="wrong-text";
    t.textContent=entry.input;
    hit.appendChild(t);
    hit.addEventListener("click",(e)=>{
      e.preventDefault();
      e.stopPropagation();
      state.wrongEntry=null;
      lastFeedback="";
      resetQuizInputPosition();
      renderGame();
    });
  } else if(entry.filled && mode==="practice") {
    hit.title="눌러서 삭제";
    hit.addEventListener("click",()=>{
      state.entries[idx].filled=false;
      state.entries[idx].input=null;
      state.nextIndex = state.entries.findIndex(e=>!e.filled);
      if(state.nextIndex<0) state.nextIndex=state.entries.length;
      lastFeedback="";
      renderGame();
    });
  }
  box.appendChild(hit);
}

function makeGameSyllable(syllableIndex, mode) {
  const box=document.createElement("div");
  box.className="syllable";
  box.appendChild(layer(ASSET.blank,"box-bg"));

  state.entries.forEach((entry,idx)=>{
    if(entry.syllableIndex!==syllableIndex) return;
    if(entry.filled && entry.input) {
      const src=overlayFor(entry.slot,entry.input);
      if(src) box.appendChild(layer(src));
      else {
        const hit=document.createElement("div");
        hit.className=`slot-hit ${entry.slot}`;
        const t=document.createElement("div");
        t.className="wrong-text";
        t.style.color = mode==="quiz" ? "#222" : "#555";
        t.textContent=entry.input;
        hit.appendChild(t);
        box.appendChild(hit);
      }
    }
    if(entry.isWrong || (entry.filled && mode==="practice") || idx===state.nextIndex) {
      addSlotHit(box,entry,idx,mode);
    }
  });

  if(state.wrongEntry && state.wrongEntry.syllableIndex===syllableIndex) {
    const fake={
      slot:state.wrongEntry.slot,
      input:state.wrongEntry.input,
      isWrong:true,
      filled:false
    };
    addSlotHit(box,fake,-1,mode);
  }
  return box;
}

function renderImageArea(problem) {
  const box=document.getElementById("gameImage");
  box.innerHTML="";
  const show = radio("showImage")==="on";
  box.classList.toggle("hidden", !show);
  if(!show) return;

  if(problem.image) {
    const img=document.createElement("img");
    img.src=problem.image;
    img.alt="";
    box.appendChild(img);
  }
}

function formatOrder(plan) {
  const style = radio("orderStyle");

  // 글자 + 화살표: 숫자를 전혀 표시하지 않음.
  if (style === "arrow") {
    return plan.map(e => e.symbol).join(" → ");
  }

  // 숫자 + 글자 + 화살표
  const circled=["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
  return plan.map((e,i)=>(circled[i] || `${i+1}.`)+e.symbol).join(" → ");
}

function currentProblem() {
  return problems[gameOrder[currentIndex]];
}

function initStateForCurrent() {
  const problem=currentProblem();
  const built=buildProblemPlan(problem.word);
  state={
    syllables:built.syllables,
    entries:built.plan.map(e=>({...e,filled:false,input:null,isWrong:false})),
    nextIndex:0,
    wrongEntry:null,
    complete:false
  };
  lastFeedback="";
}

function renderGame() {
  const problem=currentProblem();
  const mode=radio("gameMode");

  document.getElementById("gameModeTitle").textContent = mode==="practice" ? "단어 연습" : "단어 퀴즈";
  document.getElementById("progress").textContent = `${currentIndex+1} / ${gameOrder.length}`;
  renderImageArea(problem);

  const answerWordEl = document.getElementById("answerWord");
  const orderHintEl = document.getElementById("orderHint");
  answerWordEl.textContent = radio("showWord")==="on" ? problem.word : "";
  orderHintEl.textContent = radio("showOrder")==="on" ? formatOrder(state.entries) : "";
  answerWordEl.style.fontSize = answerSizeEl.value + "px";
  orderHintEl.style.fontSize = orderSizeEl.value + "px";
  document.getElementById("answerSizeLabel").textContent = answerSizeEl.value;
  document.getElementById("orderSizeLabel").textContent = orderSizeEl.value;

  const fb=document.getElementById("feedback");
  fb.textContent=lastFeedback;
  fb.className="feedback";
  if(lastFeedback==="O") fb.classList.add("ok");
  if(lastFeedback==="X") fb.classList.add("no");

  const boxes=document.getElementById("boxes");
  boxes.innerHTML="";
  state.syllables.forEach((_,i)=>boxes.appendChild(makeGameSyllable(i,mode)));

  const count=state.syllables.length;
  const baseWidth = count<=2 ? 190 : count===3 ? 165 : count===4 ? 140 : 112;
  const scale = Number(boxSizeEl.value) / 100;
  const width = Math.round(baseWidth * scale);
  document.documentElement.style.setProperty("--box-w",width+"px");
  document.getElementById("boxSizeLabel").textContent = boxSizeEl.value;

  const nextBtn=document.getElementById("nextBtn");
  nextBtn.disabled = mode==="quiz" && !state.complete;
  nextBtn.textContent = currentIndex===gameOrder.length-1 ? "끝내기" : "다음 문제";
}

function pressJamo(symbol) {
  if(!state || state.wrongEntry) return;
  const mode=radio("gameMode");

  // 오답을 지운 뒤에는 아직 채워지지 않은 첫 위치부터 다시 입력.
  if(mode==="quiz") resetQuizInputPosition();
  if(state.complete || state.nextIndex>=state.entries.length) return;

  const expected=state.entries[state.nextIndex];

  if(mode==="quiz") {
    if(symbol===expected.symbol) {
      state.wrongEntry=null;
      expected.filled=true;
      expected.input=symbol;
      state.nextIndex++;
      lastFeedback="O";
      if(state.nextIndex>=state.entries.length) state.complete=true;
    } else {
      state.wrongEntry={
        symbol:expected.symbol,
        input:symbol,
        slot:expected.slot,
        syllableIndex:expected.syllableIndex
      };
      lastFeedback="X";
    }
  } else {
    expected.filled=true;
    expected.input=symbol;
    state.nextIndex++;
    lastFeedback="";
    if(state.nextIndex>=state.entries.length) state.complete=true;
  }
  renderGame();
}

function buildJamoPanel() {
  const cg=document.getElementById("consonantGrid");
  const vg=document.getElementById("vowelGrid");
  cg.innerHTML=""; vg.innerHTML="";
  CONSONANTS.forEach(j=>{
    const b=document.createElement("button");
    b.className="jamo-btn cons";
    b.textContent=j;
    b.addEventListener("click",()=>pressJamo(j));
    cg.appendChild(b);
  });
  VOWELS.forEach(j=>{
    const b=document.createElement("button");
    b.className="jamo-btn vowel";
    b.textContent=j;
    b.addEventListener("click",()=>pressJamo(j));
    vg.appendChild(b);
  });
}

function renderProblemList() {
  const list=document.getElementById("problemList");
  const empty=document.getElementById("emptyProblems");
  list.innerHTML="";
  empty.classList.toggle("hidden",problems.length>0);
  problems.forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="problem-item";
    const thumb=document.createElement("div");
    thumb.className="problem-thumb";
    if(p.image) {
      const img=document.createElement("img");
      img.src=p.image; img.alt="";
      thumb.appendChild(img);
    } else {
      thumb.textContent="그림 없음";
    }
    const info=document.createElement("div");
    const w=document.createElement("div");
    w.className="problem-word";
    w.textContent=`${i+1}. ${p.word}`;
    const sub=document.createElement("div");
    sub.className="muted";
    sub.textContent=`${buildProblemPlan(p.word).syllables.length}음절`;
    info.append(w,sub);
    const del=document.createElement("button");
    del.className="btn danger";
    del.textContent="삭제";
    del.addEventListener("click",()=>{problems.splice(i,1);renderProblemList();});
    row.append(thumb,info,del);
    list.appendChild(row);
  });
}

function setTempImage(file) {
  const r=new FileReader();
  r.onload=()=>{
    tempImage=r.result;
    imagePreview.src=tempImage;
    imagePreview.classList.remove("hidden");
    imagePlaceholder.classList.add("hidden");
  };
  r.readAsDataURL(file);
}

function clearTempImage() {
  tempImage=null;
  imagePreview.src="";
  imagePreview.classList.add("hidden");
  imagePlaceholder.classList.remove("hidden");
}

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startGame() {
  if(problems.length===0) {
    alert("문제를 하나 이상 추가해 주세요.");
    return;
  }
  gameOrder=problems.map((_,i)=>i);
  if(radio("orderMode")==="random") gameOrder=shuffle(gameOrder);
  currentIndex=0;
  initStateForCurrent();
  setupView.classList.add("hidden");
  endView.classList.add("hidden");
  gameView.classList.remove("hidden");
  renderGame();
}

function retryCurrentProblem() {
  if(!state) return;
  initStateForCurrent();
  renderGame();
}

function nextProblem() {
  const mode=radio("gameMode");
  if(mode==="quiz" && !state.complete) return;
  if(currentIndex>=gameOrder.length-1) {
    gameView.classList.add("hidden");
    endView.classList.remove("hidden");
    return;
  }
  currentIndex++;
  initStateForCurrent();
  renderGame();
}

function restartGame() {
  currentIndex=0;
  if(radio("orderMode")==="random") gameOrder=shuffle(problems.map((_,i)=>i));
  else gameOrder=problems.map((_,i)=>i);
  initStateForCurrent();
  endView.classList.add("hidden");
  gameView.classList.remove("hidden");
  renderGame();
}

function buildPrintPage(problem, index, total, useCurrentState=false) {
  const page=document.createElement("div");
  page.className="print-page";

  const head=document.createElement("div");
  head.className="print-header";
  const left=document.createElement("div");
  left.textContent = radio("gameMode")==="practice" ? "단어 연습" : "단어 퀴즈";
  const right=document.createElement("div");
  right.textContent=`${index} / ${total}`;
  head.append(left,right);

  const body=document.createElement("div");
  body.className="print-body";

  const prob=document.createElement("div");
  prob.className="print-problem";

  const image=document.createElement("div");
  image.className="print-image";
  const showImage = radio("showImage")==="on";
  if(showImage && problem.image) {
    const img=document.createElement("img");
    img.src=problem.image; img.alt="";
    image.appendChild(img);
  }
  if(!showImage) image.classList.add("hidden");

  const ans=document.createElement("div");
  ans.className="print-answer";
  ans.textContent=radio("showWord")==="on" ? problem.word : "";
  ans.style.fontSize = (Number(answerSizeEl.value) * 0.22) + "mm";

  const built=buildProblemPlan(problem.word);
  const order=document.createElement("div");
  order.className="print-order";
  order.textContent=radio("showOrder")==="on" ? formatOrder(built.plan) : "";
  order.style.fontSize = (Number(orderSizeEl.value) * 0.19) + "mm";

  const boxes=document.createElement("div");
  boxes.className="print-boxes";
  const printScale = Number(boxSizeEl.value) / 100;
  built.syllables.forEach((_,si)=>{
    const b=document.createElement("div");
    b.className="syllable";
    b.style.width = (31 * printScale) + "mm";
    b.appendChild(layer(ASSET.blank,"box-bg"));
    if(useCurrentState && state && problem===currentProblem()) {
      state.entries.forEach(entry=>{
        if(entry.syllableIndex===si && entry.filled && entry.input) {
          const src=overlayFor(entry.slot,entry.input);
          if(src) b.appendChild(layer(src));
        }
      });
    }
    boxes.appendChild(b);
  });

  prob.append(image,ans,order,boxes);

  const jp=document.createElement("div");
  jp.className="print-jamo";
  const h1=document.createElement("h3"); h1.textContent="자음";
  const cg=document.createElement("div"); cg.className="jamo-grid";
  CONSONANTS.forEach(j=>{const x=document.createElement("button");x.className="jamo-btn cons";x.textContent=j;cg.appendChild(x);});
  const h2=document.createElement("h3"); h2.textContent="모음"; h2.style.marginTop="6mm";
  const vg=document.createElement("div"); vg.className="jamo-grid";
  VOWELS.forEach(j=>{const x=document.createElement("button");x.className="jamo-btn vowel";x.textContent=j;vg.appendChild(x);});
  jp.append(h1,cg,h2,vg);

  body.append(prob,jp);
  page.append(head,body);
  return page;
}

function printCurrent() {
  const root=document.getElementById("printRoot");
  root.innerHTML="";
  root.appendChild(buildPrintPage(currentProblem(),currentIndex+1,gameOrder.length,true));
  setTimeout(()=>window.print(),80);
}

function printAll() {
  const root=document.getElementById("printRoot");
  root.innerHTML="";
  gameOrder.forEach((pi,i)=>root.appendChild(buildPrintPage(problems[pi],i+1,gameOrder.length,false)));
  setTimeout(()=>window.print(),80);
}

buildJamoPanel();
renderProblemList();

imageDrop.addEventListener("click",()=>{imagePicker.value="";imagePicker.click();});
imageDrop.addEventListener("dragover",e=>{e.preventDefault();imageDrop.classList.add("drag");});
imageDrop.addEventListener("dragleave",()=>imageDrop.classList.remove("drag"));
imageDrop.addEventListener("drop",e=>{
  e.preventDefault(); imageDrop.classList.remove("drag");
  const f=[...e.dataTransfer.files].find(x=>x.type.startsWith("image/"));
  if(f) setTempImage(f);
});
imagePicker.addEventListener("change",()=>{
  const f=imagePicker.files && imagePicker.files[0];
  if(f) setTempImage(f);
});
document.addEventListener("paste",e=>{
  if(!setupView.classList.contains("hidden")) {
    const img=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
    if(img) {
      const f=img.getAsFile();
      if(f) {e.preventDefault();setTempImage(f);}
    }
  }
});
document.getElementById("clearImageBtn").addEventListener("click",clearTempImage);
document.getElementById("addProblemBtn").addEventListener("click",()=>{
  const w=wordInput.value.trim();
  if(!w) {alert("정답 단어를 입력해 주세요.");return;}
  if(!Array.from(w).some(isHangul)) {alert("한글 단어를 입력해 주세요.");return;}
  problems.push({word:w,image:tempImage});
  wordInput.value="";
  clearTempImage();
  renderProblemList();
  wordInput.focus();
});
wordInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") {
    e.preventDefault();
    document.getElementById("addProblemBtn").click();
  }
});

boxSizeEl.addEventListener("input",()=>{
  document.getElementById("boxSizeLabel").textContent=boxSizeEl.value;
  if(!gameView.classList.contains("hidden")) renderGame();
});

answerSizeEl.addEventListener("input",()=>{
  document.getElementById("answerSizeLabel").textContent=answerSizeEl.value;
  if(!gameView.classList.contains("hidden")) renderGame();
});
orderSizeEl.addEventListener("input",()=>{
  document.getElementById("orderSizeLabel").textContent=orderSizeEl.value;
  if(!gameView.classList.contains("hidden")) renderGame();
});
document.querySelectorAll('input[name="orderStyle"]').forEach(x=>x.addEventListener("change",()=>{
  if(!gameView.classList.contains("hidden")) renderGame();
}));

document.querySelectorAll('input[name="showImage"], input[name="showWord"], input[name="showOrder"]').forEach(x=>x.addEventListener("change",()=>{
  if(!gameView.classList.contains("hidden")) renderGame();
}));

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("retryBtn").addEventListener("click",retryCurrentProblem);
document.getElementById("nextBtn").addEventListener("click",nextProblem);
document.getElementById("backSetupBtn").addEventListener("click",()=>{
  gameView.classList.add("hidden");
  setupView.classList.remove("hidden");
});
document.getElementById("restartBtn").addEventListener("click",restartGame);
document.getElementById("homeBtn").addEventListener("click",()=>{
  endView.classList.add("hidden");
  setupView.classList.remove("hidden");
});
document.getElementById("printCurrentBtn").addEventListener("click",printCurrent);
document.getElementById("printAllBtn").addEventListener("click",printAll);
</script>
</body>
